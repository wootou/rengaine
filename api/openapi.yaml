openapi: 3.1.0

info:
  title: API Rengaine
  version: 2.28.0
  summary: Bibliothèque musicale, lecture, comptes et administration.
  license:
    name: Usage privé
  description: |
    Contrat de l'API **v2**, seule API du nouveau lecteur musique. Le lecteur web, l'appli
    téléphone et l'agent Claude en sont les clients. Ce fichier fait référence : le code de
    l'API et les types du lecteur web en découlent (types générés, jamais écrits à la main).

    **Figé le 2026-10-19** (validé par Rémy, tâche CAD-02). Toute évolution passe d'abord par ce
    fichier : ajout compatible → version mineure (2.1.0) ; changement incompatible → accord de
    l'agent de l'appli et version majeure.

    ## Conventions
    - JSON en UTF-8, noms de champs en camelCase.
    - Identifiants : entiers. Ils sont stables : l'indexeur met à jour les lignes au lieu de les
      recréer, et un fichier renommé garde l'identifiant de sa piste.
    - Dates : ISO 8601 en UTC (`2026-10-19T08:30:00.000Z`). Durées en **millisecondes**.
    - Volume : LUFS (EBU R128) et dBTP. Le serveur donne la **mesure** ; le client calcule le
      gain avec la cible choisie dans les réglages (`gain = cible - mesure`, borné par la crête).
    - Listes paginées : `limit` et `offset` en entrée ; `items`, `total`, `limit` et `offset` en sortie.
    - Les URL renvoyées (`streamUrl`, `coverUrl`) sont des chemins relatifs à la racine du serveur.
    - Chaque réponse porte un en-tête `X-Request-Id` ; il figure aussi dans les erreurs et dans
      les journaux du serveur, pour retrouver une requête.
    - Champ `x-priority` : P1 (première version), P2, P3. Une opération P2 ou P3 pas encore
      codée répond `501 not_implemented`.
    - Champ `x-roles` : rôles autorisés (`admin`, `user`, `agent`). Absent = comptes `admin` et `user`.
      L'**agent** (Claude, IA-01) n'a accès qu'aux opérations qui le citent : lecture du catalogue, de
      la bibliothèque côté admin, et propositions de lots. Ni écoute, ni données d'un compte (réglages,
      file, favoris, playlists, historique, télécommande), ni appairage : `403 forbidden` ailleurs.

    ## Authentification
    - **Lecteur web** : cookie de session `musique_session` (HttpOnly, Secure, SameSite=Strict),
      posé par `POST /auth/login`. Toute requête qui modifie quelque chose (POST, PUT, PATCH,
      DELETE) doit en plus porter l'en-tête `X-CSRF-Token`, dont la valeur est renvoyée par
      `POST /auth/login` et `GET /me`.
    - **Appli et agent** : en-tête `Authorization: Bearer <jeton>`. Un jeton par appareil, visible
      et révocable dans les réglages. L'appli obtient le sien par identifiant et mot de passe, ou
      en scannant un QR (`POST /me/pairing-codes` puis `POST /auth/pair`).
    - Un jeton n'apparaît qu'une fois, dans la réponse qui le crée. Le serveur n'en garde que
      l'empreinte.

    ## Erreurs
    Toujours le même format (`Error`), avec un `code` stable que le client peut tester.
    `429` porte un en-tête `Retry-After`.

servers:
  - url: /api/v2
    description: Le serveur Rengaine qui sert cette page
  - url: "{serveur}/api/v2"
    description: Un serveur Rengaine
    variables:
      serveur:
        default: https://musique.example.org
        description: Adresse publique du serveur ([site] url)

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: serveur
    description: Découverte, état du serveur
  - name: authentification
    description: Connexion, demande de compte, mot de passe, appairage
  - name: compte
    description: Le compte connecté, ses appareils et ses réglages
  - name: catalogue
    description: Albums, artistes, pistes, genres, recherche
  - name: lecture
    description: Flux audio, images, file d'attente, favoris, historique, lecture continue
  - name: playlists
    description: Playlists des comptes (privées, ou partagées avec tous les comptes)
  - name: telecommande
    description: "Télécommande partagée (FUT-02) : un lien donné à un invité pour piloter la file"
  - name: admin-comptes
    description: Gestion des comptes et des jetons, réglages du serveur, images de fond (admin)
  - name: admin-bibliotheque
    description: Corrections et réorganisation de la bibliothèque (admin, agent)
  - name: admin-taches
    description: Tâches de fond et journaux (admin)
  - name: mcp
    description: Serveur MCP pour l'agent Claude (IA-03)

paths:

  # ===========================================================================
  # Serveur
  # ===========================================================================

  /server:
    get:
      tags: [serveur]
      operationId: getServer
      summary: Informations et capacités du serveur
      description: |
        Sans authentification. Permet à un client de vérifier l'adresse saisie et de savoir
        quelles fonctions sont disponibles avant toute connexion.
      security: []
      x-priority: P1
      responses:
        "200":
          description: Informations du serveur
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerInfo"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  # ===========================================================================
  # Authentification
  # ===========================================================================

  /auth/login:
    post:
      tags: [authentification]
      operationId: login
      summary: Connexion par e-mail et mot de passe
      description: |
        - `client: web` : pose le cookie de session et renvoie le jeton anti-CSRF.
        - `client: app` : crée un jeton d'appareil et le renvoie (une seule fois).

        Les échecs sont comptés par compte **et par réseau** (IPv4, ou /64 en IPv6) : après 5 échecs, le
        compte est refusé 15 minutes **depuis ce réseau seulement**, avec la même réponse qu'un mauvais
        mot de passe (`401 invalid_credentials`), qui ne dit pas si le compte existe. Depuis un autre
        réseau, le titulaire se connecte normalement. L'adresse IP est signalée au journal de sécurité
        (fail2ban). Jusqu'à la version 2.24.0, le compte entier était verrouillé, avec `423`.
        **Limite** : `connexions_par_10min` par réseau.
        Un compte en attente d'approbation reçoit `403 account_pending`.
      security: []
      x-priority: P1
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Connecté
          headers:
            Set-Cookie:
              description: "Seulement pour `client: web`"
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /auth/logout:
    post:
      tags: [authentification]
      operationId: logout
      x-roles: [admin, user, agent]
      summary: Déconnexion (révoque la session ou le jeton utilisé)
      x-priority: P1
      responses:
        "204": {description: Déconnecté}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /auth/register:
    post:
      tags: [authentification]
      operationId: register
      summary: Demande de compte
      description: |
        Crée un compte **en attente**. L'admin reçoit un e-mail (adresse `[smtp] admin` de la config,
        sinon chaque admin actif) et approuve ou refuse la demande dans l'interface admin. La réponse est la même que l'adresse soit déjà connue ou non, pour
        ne pas révéler quels comptes existent.
        `403 registration_closed` si les inscriptions sont fermées.

        **Limite** : au plus 2 demandes en attente par adresse IPv4 publique, et 2 par préfixe
        IPv6 /64 (réglable : `pendingRequestsPerNetwork`). Au-delà : `429 pending_limit`, jusqu'à
        ce que l'admin traite une demande. L'IP est celle du client transmise par le proxy,
        et elle est effacée une fois la demande traitée.
      security: []
      x-priority: P1
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "202":
          description: Demande enregistrée, en attente d'approbation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcceptedResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /auth/password/forgot:
    post:
      tags: [authentification]
      operationId: forgotPassword
      summary: Demande de réinitialisation du mot de passe
      description: |
        Envoie un lien par e-mail, valable **1 heure** et à usage unique. Réponse identique que
        l'adresse existe ou non. Seul un compte actif avec mot de passe reçoit un lien (pas un compte
        en attente, suspendu ou agent), et au plus 3 liens par heure et par compte.
        Le lien porte le jeton dans le fragment, `<site>/mot-de-passe#jeton=…` : il n'est jamais envoyé
        au serveur, donc absent des journaux d'accès. Le client le lit, l'efface de l'adresse et le passe
        à `POST /auth/password/reset`. (Avant la version 2.25.0 : `?jeton=…`.)
        **Limite** : `oublis_mdp_par_heure` par réseau (10 par défaut).
      security: []
      x-priority: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "202":
          description: Demande prise en compte
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcceptedResponse"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /auth/password/reset:
    post:
      tags: [authentification]
      operationId: resetPassword
      summary: Nouveau mot de passe à partir du lien reçu par e-mail
      description: |
        Révoque toutes les sessions et tous les jetons du compte, lève les verrous après échecs,
        et invalide les autres liens. Un e-mail confirme le changement.
        `400 invalid_token` si le lien est inconnu, expiré ou déjà utilisé.
      security: []
      x-priority: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: {type: string}
                newPassword: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Mot de passe changé}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /auth/pair:
    post:
      tags: [authentification]
      operationId: pairDevice
      summary: Échange d'un code d'appairage (QR) contre un jeton d'appareil
      description: |
        Le code est à usage unique et expire après quelques minutes. Il ne donne aucun accès
        par lui-même : seule cette opération le convertit en jeton.
      security: []
      x-priority: P1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties:
                code: {type: string, examples: ["K7QF-2M9X"]}
                deviceName: {$ref: "#/components/schemas/DeviceName"}
      responses:
        "200":
          description: Appareil appairé
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  # ===========================================================================
  # Compte connecté
  # ===========================================================================

  /me:
    get:
      tags: [compte]
      operationId: getMe
      x-roles: [admin, user, agent]
      summary: Le compte connecté
      x-priority: P1
      responses:
        "200":
          description: Compte
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MeResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [compte]
      operationId: updateMe
      summary: Modifier son nom affiché
      x-priority: P1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: {$ref: "#/components/schemas/DisplayName"}
      responses:
        "200":
          description: Compte modifié
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      tags: [compte]
      operationId: deleteMe
      summary: Supprimer son compte, tout de suite et définitivement
      description: |
        Efface **immédiatement** le compte et tout ce qui lui appartient : profil, réglages, file
        d'attente, favoris, playlists, historique d'écoute, sessions et jetons (tous les appareils sont
        déconnectés), codes d'appairage, liens de télécommande, mails en attente, entrées du journal
        d'audit qu'il a faites. Rien n'est récupérable. Les corrections de la bibliothèque faites par un
        admin restent (elles servent à tous) ; leur auteur devient « Compte supprimé » (`UserRef.id` 0).

        **Délai d'annulation (obligatoire pour les clients)** : après la confirmation, le client laisse
        **15 secondes** à l'utilisateur pour annuler (compte à rebours visible et bouton « Annuler »),
        puis seulement envoie la requête. Quitter l'écran pendant ce délai annule. Le serveur, lui,
        supprime dès réception.

        Le mot de passe est redemandé. Refusé au dernier compte admin actif (`409 last_admin`). Un
        agent n'a pas cette opération (son compte est géré par l'admin). Une session web reçoit un
        cookie effacé. Tentatives limitées comme le changement de mot de passe (`429`).
      x-priority: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 200}
      responses:
        "204": {description: Compte supprimé}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /me/export:
    get:
      tags: [compte]
      operationId: exportMyData
      summary: Télécharger toutes ses données (RGPD)
      description: |
        Tout ce que le serveur garde sur le compte, dans un seul fichier JSON lisible : profil, réglages,
        file d'attente, favoris, playlists (avec leurs pistes), historique d'écoute complet, appareils
        et sessions (y compris révoqués, avec dernière IP et navigateur), liens de télécommande. Chaque
        piste est décrite par son titre, son artiste et son album, pour rester lisible hors de Rengaine
        (`track` null si la piste n'existe plus). Jamais de secret : ni mot de passe, ni jeton.

        Réponse en `Content-Disposition: attachment; filename="rengaine-export-AAAAMMJJ.json"`.
        Au plus 10 exports par heure et par compte (`429`). Un agent n'a pas cette opération.
      x-priority: P2
      responses:
        "200":
          description: Les données du compte
          headers:
            Content-Disposition:
              schema: {type: string, examples: ['attachment; filename="rengaine-export-20261024.json"']}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MyDataExport"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /me/password:
    post:
      tags: [compte]
      operationId: changePassword
      summary: Changer son mot de passe
      description: |
        Révoque les autres sessions et jetons, sauf celui qui fait la demande. Un e-mail prévient
        le titulaire du compte (si le serveur envoie des mails).
      x-priority: P1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string}
                newPassword: {$ref: "#/components/schemas/Password"}
      responses:
        "204": {description: Mot de passe changé}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/devices:
    get:
      tags: [compte]
      operationId: listMyDevices
      summary: Sessions et appareils du compte
      x-priority: P1
      responses:
        "200":
          description: Liste des sessions et jetons actifs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/devices/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [compte]
      operationId: revokeMyDevice
      summary: Révoquer une session ou un appareil
      x-priority: P1
      responses:
        "204": {description: Révoqué}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /me/pairing-codes:
    post:
      tags: [compte]
      operationId: createPairingCode
      summary: Créer un code d'appairage pour l'appli (affiché en QR)
      description: |
        Le QR est dessiné par le client à partir de `qrPayload`. Le serveur n'écrit jamais
        d'image, et le code ne vaut rien une fois utilisé ou expiré.
      x-priority: P1
      responses:
        "201":
          description: Code créé
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairingCode"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /me/settings:
    get:
      tags: [compte]
      operationId: getMySettings
      summary: Réglages de l'utilisateur (partagés entre le site et l'appli)
      description: |
        Un compte qui n'a jamais rien réglé reçoit les valeurs par défaut. L'en-tête `ETag`
        contient la version, à renvoyer dans `If-Match` lors de l'enregistrement.
      x-priority: P1
      responses:
        "200":
          description: Réglages
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserSettingsDocument"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [compte]
      operationId: putMySettings
      summary: Enregistrer les réglages
      description: |
        Remplace l'ensemble des réglages. Si un autre appareil a enregistré entre-temps,
        la réponse est `412` avec la version actuelle : le client fusionne puis réessaie.
      x-priority: P1
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserSettings"}
      responses:
        "200":
          description: Réglages enregistrés
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserSettingsDocument"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}

  /me/queue:
    get:
      tags: [lecture]
      operationId: getMyQueue
      summary: File d'attente enregistrée (reprise sur un autre appareil)
      x-priority: P1
      responses:
        "200":
          description: File d'attente, pistes comprises
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayQueue"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [lecture]
      operationId: putMyQueue
      summary: Enregistrer la file d'attente
      description: |
        Le client l'envoie quand la file change, et de temps en temps pendant la lecture pour la
        position. Même règle de version que les réglages (`If-Match`, `412`).
      x-priority: P1
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlayQueueInput"}
      responses:
        "200":
          description: File enregistrée
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayQueue"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}

  /me/favorites:
    get:
      tags: [lecture]
      operationId: listMyFavorites
      summary: Favoris
      x-priority: P2
      parameters:
        - name: type
          in: query
          required: true
          schema: {$ref: "#/components/schemas/FavoriteType"}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Favoris du type demandé, du plus récent au plus ancien
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FavoritePage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/favorites/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema: {$ref: "#/components/schemas/FavoriteType"}
      - $ref: "#/components/parameters/Id"
    put:
      tags: [lecture]
      operationId: addFavorite
      summary: Ajouter aux favoris (sans effet si déjà présent)
      x-priority: P2
      responses:
        "204": {description: Ajouté}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [lecture]
      operationId: removeFavorite
      summary: Retirer des favoris (sans effet si absent)
      x-priority: P2
      responses:
        "204": {description: Retiré}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: Mes playlists et celles que les autres comptes partagent
      description: |
        Une playlist est privée par défaut. Partagée (`shared`), tous les comptes la voient et
        l'écoutent, mais seul son créateur la modifie ; les autres peuvent la copier
        (`POST /playlists` avec ses `trackIds`).
      x-priority: P2
      parameters:
        - name: scope
          in: query
          description: "`mine` : les miennes ; `shared` : celles partagées par les autres ; `all` (défaut) : les deux"
          schema: {type: string, enum: [all, mine, shared], default: all}
      responses:
        "200":
          description: Playlists, les plus récemment modifiées d'abord
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/PlaylistSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Créer une playlist (vide, ou avec des pistes)
      x-priority: P2
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaylistInput"}
      responses:
        "201":
          description: Playlist créée
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlaylistDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /playlists/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Une playlist et ses pistes, dans l'ordre
