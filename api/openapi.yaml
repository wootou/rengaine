        in: path
        required: true
        description: Empreinte SHA-256 de l'image, en hexadécimal
        schema: {type: string, pattern: "^[0-9a-f]{64}$"}
    get:
      tags: [lecture]
      operationId: getImage
      x-roles: [admin, user, agent]
      summary: Jaquette ou image d'artiste
      description: |
        L'adresse contient l'empreinte : une image ne change jamais à une adresse donnée.
        Réponse avec `Cache-Control: private, max-age=31536000, immutable`.
        Les vignettes sont produites à la première demande puis gardées en cache.
        Aussi accessible à l'invité d'un lien de télécommande (pochettes de la file).
      security:
        - bearerAuth: []
        - cookieAuth: []
        - remoteCookie: []
      x-priority: P1
      parameters:
        - name: size
          in: query
          description: "Côté le plus long : `s` = 96 px, `m` = 300 px, `l` = 600 px, `original`"
          schema:
            type: string
            enum: [s, m, l, original]
            default: m
      responses:
        "200":
          description: Image
          headers:
            Cache-Control: {schema: {type: string}}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
            image/png: {schema: {type: string, contentMediaType: image/png}}
            image/webp: {schema: {type: string, contentMediaType: image/webp}}
        "304": {description: Inchangé (If-None-Match)}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /backgrounds:
    get:
      tags: [lecture]
      operationId: listBackgrounds
      summary: Images de fond actives (le client en tire une au hasard)
      description: |
        Images choisies par l'admin pour le fond du site. Le réglage `interface.background` du
        compte dit si le client les affiche.
      x-priority: P3
      responses:
        "200":
          description: Fonds actifs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/BackgroundRef"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /backgrounds/{id}/image:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lecture]
      operationId: getBackgroundImage
      summary: Image de fond
      description: |
        Une image ne change jamais : l'adresse donnée par `imageUrl` porte son empreinte (`v`).
        Réponse avec `Cache-Control: private, max-age=31536000, immutable`.
      x-priority: P3
      parameters:
        - name: v
          in: query
          description: Début de l'empreinte de l'image (pour le cache du navigateur)
          schema: {type: string, pattern: "^[0-9a-f]{1,64}$"}
      responses:
        "200":
          description: Image
          headers:
            Cache-Control: {schema: {type: string}}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
            image/png: {schema: {type: string, contentMediaType: image/png}}
            image/webp: {schema: {type: string, contentMediaType: image/webp}}
        "304": {description: Inchangé (If-None-Match)}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /admin/backgrounds:
    get:
      tags: [admin-comptes]
      operationId: adminListBackgrounds
      summary: Toutes les images de fond (actives ou non)
      x-priority: P3
      x-roles: [admin]
      responses:
        "200":
          description: Fonds, du plus récent au plus ancien
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Background"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [admin-comptes]
      operationId: adminCreateBackground
      summary: Ajouter une image de fond
      description: |
        Le corps est l'image elle-même (JPEG, PNG ou WebP, 6 Mo et 8000 px au plus). Le lecteur
        web la réduit avant l'envoi (2560 px de large au plus). Elle est active tout de suite.
        30 images au plus ; une image déjà présente (même empreinte) est refusée (409).
      x-priority: P3
      x-roles: [admin]
      parameters:
        - name: name
          in: query
          description: Nom affiché dans l'admin (par défaut « Fond n° … »)
          schema: {type: string, maxLength: 100}
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
          image/png: {schema: {type: string, contentMediaType: image/png}}
          image/webp: {schema: {type: string, contentMediaType: image/webp}}
      responses:
        "201":
          description: Fond ajouté
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Background"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /admin/backgrounds/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [admin-comptes]
      operationId: adminUpdateBackground
      summary: Renommer, activer ou désactiver une image de fond
      x-priority: P3
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                active: {type: boolean}
      responses:
        "200":
          description: Fond modifié
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Background"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [admin-comptes]
      operationId: adminDeleteBackground
      summary: Supprimer une image de fond
      x-priority: P3
      x-roles: [admin]
      responses:
        "204": {description: Supprimé}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /playback/next:
    post:
      tags: [lecture]
      operationId: nextTracks
      summary: Pistes suivantes pour la lecture continue intelligente
      description: |
        Choisit les pistes qui suivent selon les règles `continuous` des réglages de
        l'utilisateur (genres, favoris, clé compatible, plage de BPM, énergie, pas de répétition
        récente, artistes espacés). Le client peut surcharger certaines règles pour cette demande.

        Chaque piste choisie sert de référence à la suivante. Clé compatible : même code Camelot,
        ±1 sur la roue, ou l'autre lettre ; le double ou la moitié du BPM comptent aussi. Quand plus
        aucune piste ne respecte toutes les règles, elles sont relâchées une à une (énergie, BPM, clé,
        espacement des artistes) : la liste peut être plus courte que `count`, jamais vide tant
        qu'il reste des pistes permises (genres, pas de répétition récente).
      x-priority: P2
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NextTracksRequest"}
      responses:
        "200":
          description: Pistes proposées, dans l'ordre de lecture
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrackList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  # ===========================================================================
  # Télécommande partagée (FUT-02)
  # ===========================================================================

  /me/shares:
    get:
      tags: [telecommande]
      operationId: listMyShares
      summary: Liens de télécommande en cours
      description: Liens encore valables (ni expirés, ni révoqués), du plus récent au plus ancien.
      x-priority: P3
      responses:
        "200":
          description: Liens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/QueueShare"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [telecommande]
      operationId: createMyShare
      summary: Créer un lien de télécommande
      description: |
        Quiconque ouvre le lien pilote la file de ce compte, sans compte, dans les limites des
        droits choisis, jusqu'à l'expiration ou la révocation. Le secret n'est montré qu'une fois
        (`token`, `url`) ; le serveur n'en garde que l'empreinte. Au plus 10 liens valables à la fois.
        Sans hub temps réel (`features.remoteControl = false`) : `503 realtime_unavailable`.
      x-priority: P3
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QueueShareInput"}
      responses:
        "201":
          description: Lien créé
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueueShareCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}

  /me/shares/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [telecommande]
      operationId: revokeMyShare
      summary: Révoquer un lien de télécommande
      description: L'invité est prévenu tout de suite (événement `revoked`) et ne peut plus rien faire.
      x-priority: P3
      responses:
        "204": {description: Lien révoqué}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /me/realtime:
    get:
      tags: [telecommande]
      operationId: getMyRealtimeChannel
      summary: Canal temps réel du lecteur (commandes des invités)
      description: |
        Abonnement au hub Mercure (flux SSE) : le lecteur y reçoit les commandes des invités et
        l'annonce des liens créés ou révoqués. Le jeton ne vaut que pour ces sujets et expire vite
        (`expiresAt`) : le redemander avant. Messages : voir `RealtimeChannel`.
      x-priority: P3
      responses:
        "200":
          description: Canal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RealtimeChannel"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/player:
    put:
      tags: [telecommande]
      operationId: reportMyPlayer
      summary: État du lecteur, pour les invités
      description: |
        Le lecteur l'envoie quand des liens sont valables (`RealtimeChannel.sharesActive`) : à chaque
        changement de piste, de lecture ou de pause, et toutes les 30 s. Le lecteur qui joue devient
        celui qui reçoit les commandes ; un autre appareil en pause ne le lui reprend pas.
        Sans nouvelles depuis 75 s, le lecteur est considéré comme éteint.
      x-priority: P3
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlayerReport"}
      responses:
        "204": {description: Noté}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /remote/session:
    post:
      tags: [telecommande]
      operationId: openRemoteSession
      summary: Ouvrir la télécommande avec le secret du lien
      description: |
        Échange le secret du lien (partie après `#` de l'adresse) contre le cookie `musique_remote`
        (HttpOnly, Secure, SameSite=Strict, jusqu'à l'expiration du lien), utilisé ensuite par
        toutes les opérations de l'invité. Secret inconnu, expiré ou révoqué : `401 invalid_token`.
      security: []
      x-priority: P3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 20, maxLength: 100}
      responses:
        "200":
          description: Télécommande ouverte (cookie posé)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemoteState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /remote:
    get:
      tags: [telecommande]
      operationId: getRemote
      summary: État vu par l'invité (lecteur, file, droits)
      security:
        - remoteCookie: []
      x-priority: P3
      responses:
        "200":
          description: État
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemoteState"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /remote/search:
    get:
      tags: [telecommande]
      operationId: searchRemote
      summary: Recherche de l'invité (pistes et albums à ajouter)
      description: Seulement avec le droit `add`.
      security:
        - remoteCookie: []
      x-priority: P3
      parameters:
        - name: q
          in: query
          required: true
          description: Texte recherché, insensible à la casse et aux accents
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: Résultats (au plus 20 de chaque)
          content:
            application/json:
              schema:
                type: object
                required: [tracks, albums]
                properties:
                  tracks:
                    type: array
                    items: {$ref: "#/components/schemas/Track"}
                  albums:
                    type: array
                    items: {$ref: "#/components/schemas/AlbumSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /remote/commands:
    post:
      tags: [telecommande]
      operationId: sendRemoteCommand
      summary: Envoyer une commande au lecteur
      description: |
        Le serveur vérifie les droits du lien et les pistes, puis relaie la commande au lecteur
        qui joue, qui l'applique et enregistre la file. Les invités voient le résultat par
        l'événement `changed`. Lecteur éteint : `409 player_offline`. Droit manquant :
        `403 forbidden`. Session de l'invité : en-tête `X-CSRF-Token` (`RemoteState.csrfToken`).
      security:
        - remoteCookie: []
      x-priority: P3
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RemoteCommand"}
      responses:
        "202":
          description: Commande relayée au lecteur
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcceptedResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  # ===========================================================================
  # Admin : comptes et jetons
  # ===========================================================================

  /admin/users:
    get:
      tags: [admin-comptes]
      operationId: adminListUsers
      summary: Comptes, dont les demandes en attente
      x-priority: P1
      x-roles: [admin]
      parameters:
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/UserStatus"}
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page de comptes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUserPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [admin-comptes]
      operationId: adminCreateUser
      summary: Créer un compte directement (actif), par exemple le compte de l'agent
      x-priority: P2
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminUserCreate"}
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUser"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin-comptes]
      operationId: adminGetUser
      summary: Un compte, avec ses appareils
      x-priority: P1
      x-roles: [admin]
      responses:
        "200":
          description: Compte
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUserDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [admin-comptes]
      operationId: adminUpdateUser
      summary: Approuver, refuser, suspendre, réactiver, changer le rôle
      description: |
        Approuver une demande = passer `status` de `pending` à `active` ; un e-mail prévient
        l'utilisateur, de même qu'un refus. Suspendre révoque toutes ses sessions et tous ses jetons.
        Un admin ne peut ni se suspendre ni retirer son propre rôle d'admin.
      x-priority: P1
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminUserUpdate"}
      responses:
        "200":
          description: Compte modifié
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUser"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /admin/users/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [admin-comptes]
      operationId: adminCreateToken
      summary: Créer un jeton pour un compte (notamment le jeton de l'agent)
      x-priority: P2
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {$ref: "#/components/schemas/DeviceName"}
                expiresAt: {type: [string, "null"], format: date-time}
      responses:
        "201":
          description: Jeton créé (affiché une seule fois)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /admin/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [admin-comptes]
      operationId: adminRevokeToken
      summary: Révoquer une session ou un jeton de n'importe quel compte
      x-priority: P1
      x-roles: [admin]
      responses:
        "204": {description: Révoqué}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /admin/server-settings:
    get:
      tags: [admin-comptes]
      operationId: adminGetServerSettings
      summary: Réglages globaux du serveur
      x-priority: P1
      x-roles: [admin]
      responses:
        "200":
          description: Réglages
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    patch:
      tags: [admin-comptes]
      operationId: adminUpdateServerSettings
      summary: Modifier les réglages globaux
      x-priority: P1
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerSettingsUpdate"}
      responses:
        "200":
          description: Réglages modifiés
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # ===========================================================================
  # Admin : bibliothèque (corrections, propositions de l'agent)
  # ===========================================================================

  /admin/genre-aliases:
    get:
      tags: [admin-bibliotheque]
      operationId: adminListGenreAliases
      summary: Valeurs de genre lues dans les tags, rattachées ou non
      description: |
        Un tag ne crée jamais de genre tout seul. Les valeurs non rattachées (`mapped=false`)
        attendent que l'admin ou l'agent les relie à un genre.
      x-priority: P1
      x-roles: [admin, agent]
      parameters:
        - name: mapped
          in: query
          schema: {type: boolean}
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page d'alias, les plus fréquents d'abord
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenreAliasPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [admin-bibliotheque]
      operationId: adminMapGenreAlias
      summary: Rattacher une valeur de tag à un genre (ou la détacher)
      description: Les genres des pistes et des albums concernés sont recalculés aussitôt.
      x-priority: P1
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias, genreId]
              properties:
                alias: {type: string, minLength: 1, maxLength: 100}
                genreId: {type: [integer, "null"]}
      responses:
        "200":
          description: Alias mis à jour
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenreAlias"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /admin/albums:
    post:
      tags: [admin-bibliotheque]
      operationId: adminCreateAlbum
      summary: Créer un album à partir de pistes existantes (séparer un dossier)
      description: |
        Exemple : un dossier qui contient deux albums. Les pistes indiquées y sont déplacées par
        des corrections (`albumId`), donc annulables. L'album créé n'a pas de dossier source.
        Ces corrections forment un lot déjà appliqué (`/admin/change-sets`), qui s'annule d'un coup.
      x-priority: P2
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, trackIds]
              properties:
                title: {type: string, minLength: 1, maxLength: 255}
                albumArtist: {type: [string, "null"]}
                year: {type: [integer, "null"]}
                trackIds:
                  type: array
                  minItems: 1
                  items: {type: integer}
      responses:
        "201":
          description: Album créé
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlbumDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/albums/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [admin-bibliotheque]
      operationId: adminMergeAlbum
      summary: Fusionner cet album dans un autre (un album réparti dans deux dossiers)
      description: |
        Ses pistes sont déplacées par des corrections (`albumId`). Elles forment un lot déjà
