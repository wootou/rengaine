  /admin/inbox:
    get:
      tags: [admin-taches]
      operationId: adminListInbox
      summary: État du dépôt (albums déposés dans inbox/, en attente de rangement ou rangés)
      description: |
        Les albums déposés dans `inbox/` (rclone, Nextcloud…) sont rangés sous
        `Artiste/Album (année)/01 - Titre.ext` à chaque passage de l'indexeur, une fois immobiles.
        Cette liste vient de la base (dernier passage) : la requête ne parcourt pas le stockage.
        Les dossiers rangés restent 30 jours dans la liste.
      x-priority: P2
      x-roles: [admin, agent]
      responses:
        "200":
          description: Dossiers du dépôt, les plus récents d'abord
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/InboxItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/duplicates:
    get:
      tags: [admin-taches]
      operationId: adminListDuplicates
      summary: Albums dont des pistes existent en MP3 et en sans perte (FLAC…)
      description: |
        LEC-05. Le fichier sans perte est servi (et converti à la volée au besoin) : le MP3 en
        double ne sert plus qu'à prendre de la place. Un MP3 n'est retirable que si son FLAC est
        présent dans le stockage et de même durée (à 2 s près) ; sinon il est gardé (`kept`).
        On retire album par album avec une tâche `dedup` (`POST /admin/jobs`).
        Calculé depuis la base : la requête ne parcourt pas le stockage.
      x-priority: P2
      x-roles: [admin, agent]
      responses:
        "200":
          description: Albums concernés, ceux qui libèrent le plus de place d'abord
          content:
            application/json:
              schema:
                type: object
                required: [items, removableBytes]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/DuplicateAlbum"}
                  removableBytes: {type: integer, description: Place libérée si tout est retiré}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/same-recordings:
    get:
      tags: [admin-taches]
      operationId: adminListSameRecordings
      summary: Même enregistrement dans plusieurs pistes (empreinte acoustique)
      description: |
        BAS-03. Reconnu par l'empreinte acoustique (Chromaprint, 120 premières secondes), quels que
        soient les tags, le format, le volume ou un décalage du début : sert au dédoublonnage entre
        sources (ancienne prod, Nextcloud…). Les paires se calculent pendant l'analyse ; les pistes
        reliées entre elles forment un groupe. Rien n'est retiré : c'est un signalement.
        `score` : ressemblance la plus faible du groupe ; à partir de 0,95 c'est le même
        enregistrement (autre encodage), de 0,80 à 0,95 très proche (autre extraction, remasterisé).
      x-priority: P2
      x-roles: [admin, agent]
      parameters:
        - name: minScore
          in: query
          schema: {type: number, minimum: 0.5, maximum: 1, default: 0.8}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Groupes, les plus sûrs d'abord
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items, fingerprinted, pending]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/SameRecordingGroup"}
                      fingerprinted: {type: integer, description: Pistes dont l'empreinte est relevée}
                      pending: {type: integer, description: Pistes en attente d'empreinte}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/damaged-tracks:
    get:
      tags: [admin-taches]
      operationId: adminListDamagedTracks
      summary: Pistes dont le fichier servi a des trames illisibles
      description: |
        Relevé pendant la mesure du volume, sur le fichier servi (le meilleur de la piste). ffmpeg
        saute ces trames à la lecture, mais on entend un accroc à cet endroit. Une trame illisible
        dans la dernière seconde et demie (fin coupée à l'encodage, inaudible) n'est pas comptée.
        À savoir avant une migration : garder une autre copie du morceau s'il y en a une.
      x-priority: P2
      x-roles: [admin, agent]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Pistes concernées, les plus abîmées d'abord
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items, checked, pending]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/DamagedTrack"}
                      checked: {type: integer, description: Pistes vérifiées}
                      pending: {type: integer, description: Pistes pas encore vérifiées}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/duplicates/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin-taches]
      operationId: adminGetDuplicates
      summary: Détail d'un album, piste par piste (retirable ou gardé, et pourquoi)
      x-priority: P2
      x-roles: [admin, agent]
      responses:
        "200":
          description: Album et ses MP3 en double
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DuplicateAlbumDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /admin/job-errors:
    get:
      tags: [admin-taches]
      operationId: adminListJobErrors
      summary: Erreurs d'indexation et d'analyse, par fichier
      x-priority: P1
      x-roles: [admin, agent]
      parameters:
        - name: job
          in: query
          schema: {type: integer}
        - name: open
          in: query
          description: "`true` = seulement les erreurs non résolues"
          schema: {type: boolean, default: true}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page d'erreurs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobErrorPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/job-errors/resolve:
    post:
      tags: [admin-taches]
      operationId: adminResolveJobErrors
      summary: Marquer des erreurs comme résolues (depuis 2.28.0)
      description: |
        Les erreurs se clôturent aussi d'elles-mêmes : fichier relu sans erreur, fichier disparu,
        piste enfin analysée, dossier d'`inbox/` rangé ou retiré. Une erreur ouverte n'est jamais
        enregistrée deux fois (même fichier, même code). `ids` ou `all`, pas les deux.
      x-priority: P1
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {type: integer, minimum: 1}
                all:
                  type: boolean
                  const: true
                  description: Toutes les erreurs encore ouvertes
      responses:
        "200":
          description: Nombre d'erreurs clôturées (celles déjà résolues ne comptent pas)
          content:
            application/json:
              schema:
                type: object
                required: [resolved]
                properties:
                  resolved: {type: integer, minimum: 0}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/audit:
    get:
      tags: [admin-taches]
      operationId: adminListAudit
      summary: Journal d'audit (qui a fait quoi, quand)
      x-priority: P1
      x-roles: [admin]
      parameters:
        - name: action
          in: query
          description: Préfixe accepté (`user.` donne toutes les actions sur les comptes)
          schema: {type: string}
        - name: actor
          in: query
          schema: {type: integer}
        - name: targetType
          in: query
          schema: {type: string}
        - name: targetId
          in: query
          schema: {type: integer}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page d'événements, du plus récent au plus ancien
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/logs:
    get:
      tags: [admin-taches]
      operationId: adminListLogs
      summary: Journaux techniques du serveur (JRN-07), du plus récent au plus ancien
      description: |
        Lit les fichiers de `[journaux] dossier` : `api` (le site et l'API), `cli` (tâches de fond et
        commandes), `securite` (échecs de connexion, jetons invalides, dépassements de débit), y compris
        les fichiers déjà tournés par logrotate. Les secrets n'y figurent jamais (masqués à l'écriture).
        Une page s'arrête à `limit` entrées ou après avoir parcouru 200 000 lignes : `next` permet de
        continuer, même si la page est vide.
      x-priority: P2
      x-roles: [admin]
      parameters:
        - name: source
          in: query
          schema: {type: string, enum: [api, cli, securite], default: api}
        - name: level
          in: query
          description: Niveau minimal (le journal de sécurité est tout entier en `warning`)
          schema: {$ref: "#/components/schemas/LogLevel"}
        - name: q
          in: query
          description: Texte cherché dans la ligne entière (message et contexte), sans tenir compte de la casse
          schema: {type: string, maxLength: 200}
        - name: requestId
          in: query
          description: Seulement les lignes de cette requête (en-tête `X-Request-Id`)
          schema: {type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"}
        - name: cursor
          in: query
          description: Valeur `next` de la page précédente
          schema: {type: string, maxLength: 40}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Entrées du journal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton d'appareil (appli) ou d'agent
    cookieAuth:
      type: apiKey
      in: cookie
      name: musique_session
      description: Session du lecteur web. Les requêtes qui modifient exigent aussi `X-CSRF-Token`.
    remoteCookie:
      type: apiKey
      in: cookie
      name: musique_remote
      description: |
        Invité d'un lien de télécommande (FUT-02), posé par `POST /remote/session`. Les requêtes
        qui modifient exigent aussi `X-CSRF-Token` (`RemoteState.csrfToken`).

  headers:
    ETag:
      description: Version de la ressource, à renvoyer dans `If-Match` ou `If-None-Match`
      schema: {type: string, examples: ['"7"']}

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    Query:
      name: q
      in: query
      description: Texte recherché, insensible à la casse et aux accents
      schema: {type: string, maxLength: 200}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Seed:
      name: seed
      in: query
      description: Graine du tri aléatoire ; la même graine donne le même ordre
      schema: {type: integer, minimum: 0}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "`ETag` reçu à la dernière lecture"
      schema: {type: string}

  responses:
    BadRequest:
      description: Requête invalide (paramètre manquant ou hors limites)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Pas authentifié, ou identifiants, jeton ou code invalides
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Authentifié, mais pas autorisé (rôle insuffisant, compte en attente…)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Élément introuvable
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Conflit avec l'état actuel (nom déjà pris, lot déjà appliqué…)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PreconditionFailed:
      description: |
        Modifié entre-temps par un autre appareil. `error.details.current` contient la version
        actuelle ; l'en-tête `ETag` sa version.
      headers:
        ETag: {$ref: "#/components/headers/ETag"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PreconditionRequired:
      description: En-tête `If-Match` manquant
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: Trop de requêtes
      headers:
        Retry-After:
          description: Secondes à attendre
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: Fonction prévue (P2 ou P3) mais pas encore disponible
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    StorageUnavailable:
      description: Le stockage (S3 ou disque) ne répond pas
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:

    # ---------------------------------------------------------------- Communs

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message, requestId]
          properties:
            status: {type: integer, examples: [404]}
            code:
              type: string
              description: |
                Code stable, testable par le client. Exemples : `bad_request`, `unauthorized`,
                `invalid_credentials`, `invalid_code` (code d'appairage), `invalid_token` (lien de nouveau mot de passe), `account_pending`, `account_suspended`,
                `account_locked` (plus renvoyé depuis 2.25.0), `registration_closed`, `pending_limit`, `forbidden`, `csrf_invalid`
                (en-tête `X-CSRF-Token` absent ou faux), `not_found`, `method_not_allowed`, `conflict`,
                `version_conflict`, `precondition_required`, `rate_limited`, `range_not_satisfiable`,
                `not_implemented`, `storage_unavailable`, `internal`, `player_offline` (aucun lecteur
                allumé pour la télécommande), `realtime_unavailable` (hub temps réel absent ou injoignable).
                Toute opération peut répondre `401`, `403 csrf_invalid` (session web), `429` et `503` avec
                ce format, même si l'opération ne les liste pas.
              examples: [not_found]
            message:
              type: string
              description: Message lisible, en français
              examples: [Album introuvable]
            requestId: {type: string, examples: [01JADQ8Z6R5Y3W0N2C4V7B9K1M]}
            details:
              type: object
              description: Précisions (champ invalide, version actuelle…)
              additionalProperties: true

    PageInfo:
      type: object
      required: [total, limit, offset]
      properties:
        total: {type: integer, description: Nombre total d'éléments correspondant à la demande}
        limit: {type: integer}
        offset: {type: integer}

    AcceptedResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}

    DateTime:
      type: string
      format: date-time
      examples: ["2026-10-19T08:30:00.000Z"]

    Camelot:
      type: string
      pattern: "^(1[0-2]|[1-9])[AB]$"
      examples: [8A]

    # ---------------------------------------------------------------- Serveur

    Language:
      type: string
      enum: [fr, en]
      default: fr
      description: Langue de l'interface (`fr` français, `en` anglais)

    ServerInfo:
      type: object
      required: [name, apiVersion, language, registrationOpen, features, limits]
      properties:
        name: {type: string, examples: [Rengaine]}
        apiVersion: {type: string, examples: [2.0.0]}
        registrationOpen: {type: boolean}
        language:
          $ref: "#/components/schemas/Language"
          description: |
            Langue du serveur, choisie par l'admin (WEB-13, depuis la 2.22.0) : celle du site web pour tous
            les comptes. Les textes écrits par le serveur la suivent : `message` des erreurs et des réponses,
            mails, noms et descriptions des ambiances (`GET /moods`), motifs du dépôt et des doublons. Les noms
            de genres restent ceux de la bibliothèque. Un client garde ses propres textes et se fie aux `code`
            d'erreur, qui ne changent pas. Absent avant la 2.22.0 : lire `fr`.
        features:
          type: object
          description: Fonctions disponibles sur ce serveur
          required: [transcoding, continuousPlay, analysis, favorites, history, pairing, passwordReset]
          properties:
            transcoding:
              type: boolean
              description: Conversion à la volée (formats autres que `original`)
            transcodingFormats:
              type: array
              items: {type: string, enum: [mp3, opus, flac]}
            continuousPlay: {type: boolean, description: "`POST /playback/next`"}
            analysis:
              type: object
              description: Analyses audio disponibles
              properties:
                loudness: {type: boolean}
                silence: {type: boolean}
                bpm: {type: boolean}
                key: {type: boolean}
                energy: {type: boolean}
                waveform: {type: boolean, description: "`GET /tracks/{id}/waveform` (AUD-07)"}
                beatGrid: {type: boolean, description: "`PlaybackInfo.beatGrid` (LEC-06)"}
                fingerprint: {type: boolean, description: "Empreinte acoustique, `GET /admin/same-recordings` (BAS-03)"}
            remoteControl: {type: boolean, description: "Télécommande partagée et hub temps réel (FUT-02, `/me/shares`) ; `false` aussi quand un admin l'a désactivée (`ServerSettings.remoteControlEnabled`)"}
            favorites: {type: boolean}
            history: {type: boolean}
            pairing: {type: boolean}
            passwordReset:
              type: boolean
              description: "« Mot de passe oublié » possible : le serveur envoie des mails (SMTP configuré)"
        limits:
          type: object
          required: [maxPageSize, maxQueueLength]
          properties:
            maxPageSize: {type: integer, examples: [500]}
            maxQueueLength: {type: integer, examples: [5000]}
        library:
          type: object
          description: Taille de la bibliothèque (seulement pour un client authentifié)
          properties:
            albums: {type: integer}
            artists: {type: integer}
            tracks: {type: integer}
            durationMs: {type: integer}
            updatedAt: {$ref: "#/components/schemas/DateTime"}

    # ---------------------------------------------------------------- Comptes

    Role:
      type: string
      enum: [admin, user, agent]
      description: "`agent` = Claude ; limité à la lecture de la bibliothèque et aux propositions"

    UserStatus:
      type: string
      enum: [pending, active, suspended, refused]

    DisplayName:
      type: string
      minLength: 1
      maxLength: 100

    DeviceName:
      type: string
      minLength: 1
      maxLength: 100
      examples: [Pixel 8 de Rémy]

    Password:
      type: string
      minLength: 10
      maxLength: 200
      description: 10 caractères au moins ; haché en argon2id

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: {type: integer}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {$ref: "#/components/schemas/Role"}

    ExportTrack:
      description: Piste décrite pour rester lisible hors de Rengaine ; null si elle n'existe plus
      oneOf:
        - type: object
          required: [id, title, artist, album]
          properties:
            id: {type: integer}
            title: {type: string}
            artist: {type: string}
            album: {type: string}
        - type: "null"

    MyDataExport:
      type: object
      description: Fichier d'export des données d'un compte (`GET /me/export`). Des champs peuvent s'ajouter.
      required: [format, formatVersion, exportedAt, server, account, settings, queue, favorites, playlists, history, devices, remoteShares]
      properties:
        format: {type: string, const: rengaine-export}
        formatVersion: {type: integer, const: 1}
        exportedAt: {$ref: "#/components/schemas/DateTime"}
        server:
          type: object
          required: [name, url, apiVersion]
          properties:
            name: {type: string}
            url: {type: string}
            apiVersion: {type: string}
        account:
          type: object
          required: [id, email, displayName, role, status, createdAt, lastLoginAt, requestMessage]
          properties:
            id: {type: integer}
            email: {type: string}
            displayName: {type: string}
            role: {$ref: "#/components/schemas/Role"}
            status: {type: string}
            createdAt: {$ref: "#/components/schemas/DateTime"}
            lastLoginAt:
              oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]
            requestMessage: {type: [string, "null"], description: Le mot laissé à l'admin lors de la demande de compte}
        settings:
          type: [object, "null"]
          description: Le document de réglages tel qu'enregistré (`UserSettings`), null si jamais enregistré
        queue:
          type: [object, "null"]
          required: [mode, currentIndex, positionMs, updatedAt, tracks]
          properties:
            mode: {type: string}
            currentIndex: {type: [integer, "null"]}
            positionMs: {type: integer}
            updatedAt: {$ref: "#/components/schemas/DateTime"}
            tracks:
              type: array
              items: {$ref: "#/components/schemas/ExportTrack"}
        favorites:
          type: array
          items:
            type: object
            required: [type, id, name, addedAt]
            properties:
              type: {type: string, enum: [track, album, artist]}
              id: {type: integer}
              name: {type: [string, "null"], description: "Titre (piste, album) ou nom (artiste) ; null s'il n'existe plus"}
              addedAt: {$ref: "#/components/schemas/DateTime"}
        playlists:
          type: array
          items:
            type: object
            required: [id, name, description, shared, createdAt, updatedAt, tracks]
            properties:
              id: {type: integer}
              name: {type: string}
              description: {type: [string, "null"]}
              shared: {type: boolean}
              createdAt: {$ref: "#/components/schemas/DateTime"}
              updatedAt: {$ref: "#/components/schemas/DateTime"}
              tracks:
                type: array
                items:
                  type: object
                  required: [addedAt, track]
                  properties:
                    addedAt: {$ref: "#/components/schemas/DateTime"}
                    track: {$ref: "#/components/schemas/ExportTrack"}
        history:
          type: array
          description: Toutes les écoutes, de la plus ancienne à la plus récente
          items:
            type: object
            required: [startedAt, playedMs, completed, skipped, context, track]
            properties:
              startedAt: {$ref: "#/components/schemas/DateTime"}
              playedMs: {type: integer}
              completed: {type: boolean}
              skipped: {type: boolean}
              context: {type: [string, "null"]}
              track: {$ref: "#/components/schemas/ExportTrack"}
        devices:
          type: array
          description: Sessions et jetons, y compris révoqués ou expirés
          items:
            type: object
            required: [name, kind, createdAt, lastUsedAt, lastIp, userAgent, expiresAt, revokedAt]
            properties:
              name: {type: [string, "null"]}
              kind: {type: string, enum: [web, app, agent]}
              createdAt: {$ref: "#/components/schemas/DateTime"}
              lastUsedAt:
                oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]
              lastIp: {type: [string, "null"]}
              userAgent: {type: [string, "null"]}
              expiresAt:
                oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]
              revokedAt:
                oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]
        remoteShares:
          type: array
          items:
            type: object
            required: [label, rights, createdAt, expiresAt, revokedAt, lastUsedAt]
            properties:
              label: {type: string}
              rights: {$ref: "#/components/schemas/QueueShareRights"}
              createdAt: {$ref: "#/components/schemas/DateTime"}
              expiresAt: {$ref: "#/components/schemas/DateTime"}
              revokedAt:
                oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]
              lastUsedAt:
                oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]

    UserRef:
      type: object
      description: |
        Auteur d'une action (compte, agent compris). Compte supprimé depuis (`DELETE /me`) : `id` 0,
        `displayName` « Compte supprimé », `role` `user`.
      required: [id, displayName, role]
      properties:
        id: {type: integer, minimum: 0}
        displayName: {type: string}
        role: {$ref: "#/components/schemas/Role"}

    MeResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: "#/components/schemas/User"}
        csrfToken:
          type: string
          description: Seulement pour une session web
        currentTokenId:
          type: integer
          description: Session ou jeton utilisé pour cette requête

    LoginRequest:
      type: object
      required: [email, password, client]
      properties:
        email: {type: string, format: email}
        password: {type: string, maxLength: 200}
        client:
          type: string
          enum: [web, app]
        deviceName:
          $ref: "#/components/schemas/DeviceName"
          description: "Obligatoire pour `client: app`"

    LoginResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: "#/components/schemas/User"}
        csrfToken:
          type: string
          description: "`client: web` seulement"
        token:
          type: string
          description: "`client: app` seulement ; affiché une seule fois"
        tokenId: {type: integer}

    TokenResponse:
      type: object
      required: [token, tokenId, user]
      properties:
        token:
          type: string
          description: Affiché une seule fois ; le serveur n'en garde que l'empreinte
        tokenId: {type: integer}
        user: {$ref: "#/components/schemas/User"}

    RegisterRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: {type: string, format: email}
        displayName: {$ref: "#/components/schemas/DisplayName"}
        password: {$ref: "#/components/schemas/Password"}
        message:
          type: string
          maxLength: 1000
          description: Mot pour l'admin (qui êtes-vous ?)

    Device:
      type: object
      required: [id, kind, name, prefix, createdAt, current]
      properties:
        id: {type: integer}
        kind:
          type: string
          enum: [web, app, agent]
        name: {type: string}
        prefix:
          type: string
          description: Début du jeton, pour le reconnaître
        createdAt: {$ref: "#/components/schemas/DateTime"}
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        lastIp: {type: [string, "null"]}
        userAgent: {type: [string, "null"]}
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        current:
          type: boolean
          description: C'est la session ou le jeton de cette requête

    PairingCode:
      type: object
      required: [code, expiresAt, qrPayload]
      properties:
        code:
          type: string
          description: À saisir à la main si le QR ne peut pas être scanné
          examples: [K7QF-2M9X]
        expiresAt: {$ref: "#/components/schemas/DateTime"}
        qrPayload:
          type: string
          description: |
            Contenu du QR, que l'appli sait lire : `rengaine://pair?server=<adresse du serveur>&code=<code>`
            (schéma `rengaine://`, depuis la 2.19.1 ; `musique://` avant, jamais utilisé par une appli).
          examples: ["rengaine://pair?server=https%3A%2F%2Fmusique.example.org&code=K7QF-2M9X"]

    AdminUser:
      type: object
      required: [id, email, displayName, role, status, createdAt]
      properties:
        id: {type: integer}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        status: {$ref: "#/components/schemas/UserStatus"}
        requestMessage: {type: [string, "null"]}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        decidedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        lastLoginAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [devices]
          properties:
            devices:
              type: array
              items: {$ref: "#/components/schemas/Device"}

    AdminUserPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/AdminUser"}

    AdminUserCreate:
      type: object
      required: [email, displayName, role]
      properties:
        email: {type: string, format: email}
        displayName: {$ref: "#/components/schemas/DisplayName"}
        role: {$ref: "#/components/schemas/Role"}
        password:
          $ref: "#/components/schemas/Password"
          description: Absent pour un compte agent (jeton seulement)

    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        status: {$ref: "#/components/schemas/UserStatus"}
        role: {$ref: "#/components/schemas/Role"}
        displayName: {$ref: "#/components/schemas/DisplayName"}

    ServerSettings:
      type: object
      required: [serverName, language, registrationOpen, pendingRequestsPerNetwork, remoteControlEnabled, realtimeService, assistant]
      properties:
        serverName: {type: string, maxLength: 100}
        language:
          $ref: "#/components/schemas/Language"
          description: Langue du site pour tous les comptes (annoncée par `GET /server`)
        registrationOpen: {type: boolean}
        pendingRequestsPerNetwork:
          type: integer
          description: Demandes de compte en attente autorisées par IPv4 publique et par IPv6 /64
          default: 2
        remoteControlEnabled:
          type: boolean
          default: true
          description: |
            Télécommande partagée autorisée (FUT-02). La passer à `false` prévient les invités connectés et
            les lecteurs (message `disabled`), refuse les routes de la télécommande (`503 realtime_unavailable`),
            annonce `features.remoteControl = false` et arrête le hub temps réel ; les liens ne sont pas révoqués
            et revivent quand on la rallume (avant leur expiration).
        realtimeService:
          type: string
          enum: [running, stopped, absent]
          readOnly: true
          description: |
            État du hub temps réel : `running` (répond), `stopped` (arrêté ou injoignable), `absent` (pas de
            section `[mercure]`). Après un changement de `remoteControlEnabled`, la réponse attend jusqu'à 3 s que
            le service ait suivi.
        assistant:
          readOnly: true
          description: |
            Modèle d'IA de la réorganisation lancée depuis l'admin (tâche `organize`, IA-04), ou `null` s'il
            n'y en a pas. Il se configure dans la section `[ia]` de `rengaine.ini` (la clé n'est jamais renvoyée).
          oneOf:
            - type: "null"
            - type: object
              required: [provider, model]
              properties:
                provider: {type: string, enum: [anthropic, openai]}
                model: {type: string, examples: [claude-opus-5-5]}

    ServerSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        serverName: {type: string, minLength: 1, maxLength: 100}
        language: {$ref: "#/components/schemas/Language"}
        registrationOpen: {type: boolean}
        pendingRequestsPerNetwork: {type: integer, minimum: 1, maximum: 20}
        remoteControlEnabled: {type: boolean}

    # ---------------------------------------------------------------- Réglages

    UserSettingsDocument:
      type: object
      required: [version, updatedAt, settings]
      properties:
        version: {type: integer}
        updatedAt: {$ref: "#/components/schemas/DateTime"}
        settings: {$ref: "#/components/schemas/UserSettings"}

    UserSettings:
      type: object
      description: |
        Réglages partagés entre le site et l'appli (CPT-04). Tous les champs sont présents en
        lecture (valeurs par défaut comprises). Un client ignore les champs qu'il ne connaît pas
        mais les **renvoie tels quels** à l'enregistrement, pour ne pas effacer les réglages
        d'un client plus récent. À l'enregistrement, `infinite` et `random` peuvent manquer
        (client antérieur) : ils gardent alors leur valeur par défaut.
      required: [playback, continuous, interface, infinite, random]
      additionalProperties: true
      properties:
        playback:
          type: object
          required: [normalization, targetLufs, preventClipping, crossfadeMs, crossfadeWithinAlbum, gapless, streamQuality]
          additionalProperties: true
          properties:
            normalization:
              type: string
              enum: ["off", track, album, auto]
              default: auto
              description: |
                `auto` = gain d'album quand on écoute un album dans l'ordre, gain de piste sinon
                (aléatoire, file mélangée, lecture continue).
            targetLufs:
              type: number
              minimum: -23
              maximum: -8
              default: -16
              description: Volume visé ; `gain = targetLufs - loudnessLufs`
            preventClipping:
              type: boolean
              default: true
              description: Le gain est réduit si la crête dépasserait 0 dBTP
            crossfadeMs:
              type: integer
              minimum: 0
              maximum: 12000
              default: 0
              description: Durée du fondu enchaîné ; 0 = pas de fondu
            crossfadeWithinAlbum:
              type: boolean
              default: false
              description: Fondu aussi entre deux pistes consécutives d'un même album (non conseillé pour les albums live)
            gapless:
              type: boolean
              default: true
              description: Enchaînement sans blanc (piste suivante préchargée)
            beatSync:
              type: boolean
              default: true
              description: |
                Fondu enchaîné calé sur le tempo (LEC-06) : quand les deux pistes ont une grille des
                temps et des tempos proches (6 % au plus, ou le double, ou la moitié), le fondu dure un
                nombre entier de mesures, commence sur un temps, et la suivante part sur un temps, ralentie
                ou accélérée (sans changer la hauteur) pour suivre la première, puis revient à sa vitesse.
            streamQuality:
              type: object
              required: [wifi, mobile]
              properties:
                wifi: {$ref: "#/components/schemas/StreamQuality"}
                mobile: {$ref: "#/components/schemas/StreamQuality"}
        continuous:
          type: object
          description: Règles de la lecture continue intelligente (LEC-03)
          required: [enabled, genres, excludedGenres, favoritesWeight, harmonicMixing, bpmTolerancePercent, energyTrend, noRepeatHours, artistSpacing]
          additionalProperties: true
          properties:
            enabled:
              type: boolean
              default: false
              description: Quand la file se termine, continuer avec des pistes choisies
            genres:
              type: array
              items: {type: integer}
              default: []
              description: Genres préférés (vide = tous)
            excludedGenres:
              type: array
              items: {type: integer}
              default: []
            favoritesWeight:
              type: number
              minimum: 0
              maximum: 1
              default: 0.3
              description: 0 = ignorer les favoris, 1 = seulement des favoris
            harmonicMixing:
              type: boolean
              default: false
              description: Enchaîner des clés compatibles (même numéro Camelot, ±1, ou A↔B)
            bpmTolerancePercent:
              type: [integer, "null"]
              minimum: 0
              maximum: 50
              default: null
              description: Écart de BPM accepté avec la piste précédente ; null = pas de contrainte
            energyTrend:
              type: string
              enum: [any, steady, rising, falling]
              default: any
            noRepeatHours:
              type: integer
              minimum: 0
              maximum: 720
              default: 24
              description: Ne pas rejouer une piste écoutée depuis moins de N heures
            artistSpacing:
              type: integer
              minimum: 0
              maximum: 20
              default: 3
              description: Nombre minimal de pistes entre deux pistes d'un même artiste
        interface:
          type: object
          required: [theme]
          additionalProperties: true
          properties:
            theme:
              type: string
              enum: [auto, light, dark]
              default: auto
            background:
              type: boolean
              default: true
              description: |
                Afficher une image de fond (tirée au hasard parmi celles que l'admin a activées).
                Facultatif à l'enregistrement : absent, il reprend sa valeur par défaut.
        infinite:
          type: object
          description: |
            Mode infini (WEB-05) : quand la file arrive à sa fin, le lecteur la complète avec des pistes
            au hasard (`GET /random/tracks`) du genre de la piste en cours ; si ce genre est épuisé,
            de toute la bibliothèque. Plus simple que la lecture continue (`continuous`, LEC-03).
          required: [enabled]
          additionalProperties: true
          properties:
            enabled: {type: boolean, default: true}
        random:
          type: object
          description: |
            Dernier tirage de la page « Aléatoire » : le site et l'appli le reprennent. Se traduit en
            `GET /random/tracks?genre=…&excludeAlbum=…&count=…`.
          required: [genreIds, excludedAlbumIds, count]
          additionalProperties: true
          properties:
            genreIds:
              type: array
              maxItems: 500
              items: {type: integer}
              default: []
              description: Genres tirés (vide = tous)
            excludedAlbumIds:
              type: array
              maxItems: 500
              items: {type: integer}
              default: []
              description: Albums décochés dans ces genres
            count: {type: integer, minimum: 1, maximum: 200, default: 100}

    StreamQuality:
      type: string
      enum: [original, high, medium, low]
      default: original
      description: |
        `original` = fichier tel quel ; `high` = Opus 256 kbit/s ; `medium` = Opus 160 ;
        `low` = Opus 96. Pour un client qui ne lit pas l'Opus : MP3 320, 192 et 128.
        Sans conversion sur le serveur (`features.transcoding = false`), tout est servi en `original`.

    # ---------------------------------------------------------------- Catalogue

    PlaylistInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, "null"], maxLength: 1000}
        shared: {type: boolean, default: false}
        trackIds:
          type: array
          maxItems: 5000
          description: Pistes de départ, dans l'ordre (ex. la file d'attente, ou une playlist copiée)
          items: {type: integer}

    PlaylistSummary:
      type: object
      required: [id, name, description, owner, mine, shared, trackCount, durationMs, coverUrls, createdAt, updatedAt]
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: [string, "null"]}
        owner:
          type: object
          required: [id, displayName]
          properties:
            id: {type: integer}
            displayName: {type: string}
        mine: {type: boolean, description: Créée par le compte connecté (lui seul la modifie)}
        shared: {type: boolean}
        trackCount: {type: integer}
        durationMs: {type: integer}
        coverUrls:
          type: array
          maxItems: 4
          description: Pochettes des premiers albums différents, pour une mosaïque
          items: {type: string}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        updatedAt: {$ref: "#/components/schemas/DateTime"}

    PlaylistDetail:
      allOf:
        - $ref: "#/components/schemas/PlaylistSummary"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, position, addedAt, track]
                properties:
                  id: {type: integer, description: Identifiant de l'entrée (une piste peut figurer deux fois)}
                  position: {type: integer}
                  addedAt: {$ref: "#/components/schemas/DateTime"}
                  track: {$ref: "#/components/schemas/Track"}

    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}

    AlbumRef:
      type: object
      required: [id, title]
      properties:
        id: {type: integer}
        title: {type: string}

    GenreRef:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}

    Genre:
      type: object
      required: [id, name, parentId, albumCount, trackCount, aliases]
      properties:
        id: {type: integer}
        name: {type: string}
        parentId: {type: [integer, "null"]}
        albumCount: {type: integer}
        trackCount:
          type: integer
          description: Pistes dont c'est un genre effectif
        aliases:
          type: array
          description: Valeurs de tag rattachées à ce genre
          items: {type: string}
          examples: [["Hip-Hop/Rap", "Hip Hop"]]

    GenreInput:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        parentId: {type: [integer, "null"]}

    GenreAlias:
      type: object
      required: [alias, genre, trackCount, firstSeenAt]
      properties:
        alias:
          type: string
          description: Valeur telle qu'elle figure dans les tags
        genre:
          description: Genre rattaché ; `null` = valeur pas encore rattachée
          oneOf:
            - $ref: "#/components/schemas/GenreRef"
            - type: "null"
        trackCount: {type: integer}
        firstSeenAt: {$ref: "#/components/schemas/DateTime"}

    GenreAliasPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/GenreAlias"}

    CollectionKind:
      type: string
      enum: [category, mood, collection]

    Collection:
      type: object
      required: [id, kind, name, albumCount, coverUrls]
      properties:
        id: {type: integer}
        kind: {$ref: "#/components/schemas/CollectionKind"}
        name: {type: string}
        description: {type: [string, "null"]}
        parentId: {type: [integer, "null"]}
        albumCount: {type: integer}
        coverUrls:
          type: array
          maxItems: 4
          description: Pochettes des premiers albums (mosaïque)
          items: {type: string}

    CollectionDetail:
      allOf:
        - $ref: "#/components/schemas/Collection"
        - type: object
          required: [albums]
          properties:
            albums:
              type: array
              items: {$ref: "#/components/schemas/AlbumSummary"}

    CollectionInput:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: [string, "null"], maxLength: 1000}

    MoodId:
      type: string
      enum: [calme, concentration, energique, danser]

    Mood:
      type: object
      required: [id, name, description, trackCount]
      properties:
        id: {$ref: "#/components/schemas/MoodId"}
        name: {type: string, examples: ["Pour danser"]}
        description: {type: string}
        trackCount: {type: integer}

    Decade:
      type: object
      required: [decade, albumCount, trackCount]
      properties:
        decade: {type: integer, description: "Première année : 1980 pour les années 80", examples: [1980]}
        albumCount: {type: integer}
        trackCount: {type: integer}

    CoverUrl:
      type: [string, "null"]
      description: |
        Chemin de l'image, sans taille : le client ajoute `?size=s|m|l`. `null` = pas d'image ;
        le client affiche alors son image par défaut.
      examples: [/api/v2/images/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08]

    AlbumSummary:
      type: object
      required: [id, title, kind, artist, artistName, year, trackCount, discCount, durationMs, hasLossless, coverUrl, genres, addedAt, favorite]
      properties:
        id: {type: integer}
        title: {type: string}
        kind:
          type: string
          enum: [album, loose]
          description: |
            `loose` = dossier de pistes en vrac, sans album commun dans les tags (le titre est
            alors le nom du dossier). Le client peut l'afficher autrement qu'un album.
        artist:
          description: Artiste de l'album ; `null` pour une compilation d'artistes divers
          oneOf:
            - $ref: "#/components/schemas/ArtistRef"
            - type: "null"
        artistName:
          type: string
          description: Nom à afficher (« Artistes divers » pour une compilation)
        year: {type: [integer, "null"]}
        trackCount: {type: integer}
        discCount: {type: integer}
        durationMs: {type: integer}
        hasLossless: {type: boolean}
        coverUrl: {$ref: "#/components/schemas/CoverUrl"}
        genres:
          type: array
          items: {$ref: "#/components/schemas/GenreRef"}
        addedAt: {$ref: "#/components/schemas/DateTime"}
        favorite: {type: boolean}

    AlbumDetail:
      allOf:
        - $ref: "#/components/schemas/AlbumSummary"
        - type: object
          required: [tracks, loudness, collections]
          properties:
            isCompilation: {type: boolean}
            loudness: {$ref: "#/components/schemas/Loudness"}
            collections:
              type: array
              items:
                type: object
                required: [id, kind, name]
                properties:
                  id: {type: integer}
                  kind: {$ref: "#/components/schemas/CollectionKind"}
                  name: {type: string}
            tracks:
              type: array
              description: Triées par disque puis par numéro de piste
              items: {$ref: "#/components/schemas/Track"}

    AlbumPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/AlbumSummary"}

    ArtistSummary:
      type: object
      required: [id, name, albumCount, imageUrl]
      properties:
        id: {type: integer}
        name: {type: string}
        sortName: {type: [string, "null"]}
        albumCount: {type: integer}
        imageUrl: {$ref: "#/components/schemas/CoverUrl"}

    ArtistDetail:
      allOf:
        - $ref: "#/components/schemas/ArtistSummary"
        - type: object
          required: [albums, appearsOn, favorite]
          properties:
            favorite: {type: boolean}
            albums:
              type: array
              description: Albums dont il est l'artiste principal
              items: {$ref: "#/components/schemas/AlbumSummary"}
            appearsOn:
              type: array
              description: Autres albums où il apparaît (compilations, featurings)
              items: {$ref: "#/components/schemas/AlbumSummary"}

    ArtistPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/ArtistSummary"}

    AudioFormat:
      type: object
      required: [format, lossless, sizeBytes]
      properties:
        format:
          type: string
          enum: [mp3, flac, opus, vorbis, aac, alac, wav, other]
        lossless: {type: boolean}
        bitrateKbps: {type: [integer, "null"]}
        sampleRateHz: {type: [integer, "null"]}
        bitDepth: {type: [integer, "null"]}
        channels: {type: [integer, "null"]}
        sizeBytes: {type: integer}

    Loudness:
      type: object
      description: Mesure EBU R128 ; champs `null` tant que l'analyse n'est pas faite
      required: [lufs, truePeakDbtp]
      properties:
        lufs: {type: [number, "null"], examples: [-8.4]}
        truePeakDbtp: {type: [number, "null"], examples: [0.3]}

    PlaybackInfo:
      type: object
      description: |
        Ce qu'il faut au lecteur pour la normalisation et le fondu (API-06). Chaque valeur est
        `null` tant que l'analyse correspondante n'a pas tourné.
      required: [track, album, audioStartMs, audioEndMs, bpm, key, camelot, energy]
      properties:
        track: {$ref: "#/components/schemas/Loudness"}
        album: {$ref: "#/components/schemas/Loudness"}
        audioStartMs:
          type: [integer, "null"]
          description: Fin du silence de début
        audioEndMs:
          type: [integer, "null"]
          description: Début du silence de fin ; le fondu commence au plus tard ici
        bpm: {type: [number, "null"]}
        key:
          type: [string, "null"]
          description: Notation anglaise (`Am`, `F#`)
        camelot:
          oneOf:
            - $ref: "#/components/schemas/Camelot"
            - type: "null"
        energy:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: |
            Énergie perçue (AUD-06) : volume moyen, densité d'attaques et brillance du son. Calme près
            de 0, intense près de 1. Approximative : sert à orienter la lecture continue.
        danceability:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Dansabilité (AUD-06, algorithme DFA d'Essentia ramené entre 0 et 1)
        beatGrid:
          description: |
            Grilles des temps (LEC-06) relevées sur les 30 premières et les 30 dernières secondes : un
            humain ne garde pas un tempo exact sur tout un morceau, mais il le tient sur une demi-minute.
            Chaque bout vaut `null` si les temps détectés s'écartent de la grille (tempo libre, fondu
            sans rythme). Sert à caler le fondu enchaîné sur le tempo. Absent ou `null` tant que
            l'analyse n'a pas tourné, ou si aucun bout n'a de grille.
          oneOf:
            - type: "null"
            - type: object
              required: [intro, outro]
              properties:
                intro:
                  oneOf:
                    - $ref: "#/components/schemas/BeatGrid"
                    - type: "null"
                outro:
                  oneOf:
                    - $ref: "#/components/schemas/BeatGrid"
                    - type: "null"

    BeatGrid:
      type: object
      description: "Grille régulière : un temps tombe à `offsetMs + n × 60000 / bpm` (n entier)"
      required: [bpm, offsetMs]
      properties:
        bpm: {type: number, examples: [124.062]}
        offsetMs:
          type: number
          minimum: 0
          description: Position du premier temps de la grille (le plus proche du début du fichier)
          examples: [312.5]

    Waveform:
      type: object
      required: [trackId, durationMs, stepMs, levels]
      properties:
        trackId: {type: integer}
        durationMs: {type: integer}
        stepMs:
          type: number
          description: Durée d'une tranche ; la dernière peut être plus courte
        levels:
          type: array
          description: Niveau RMS de chaque tranche en dBFS (de -63,75 à 0, par pas de 0,25) ; `null` = silence
          items: {type: [number, "null"], maximum: 0}

    Track:
      type: object
      required: [id, title, artistCredit, artists, album, genres, discNumber, trackNumber, durationMs, coverUrl, streamUrl, formats, playback, favorite, available]
      properties:
        id: {type: integer}
        title: {type: string}
        artistCredit:
          type: string
          description: Texte affiché (« Gorillaz feat. Kali Uchis »)
        artists:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ArtistRef"
              - type: object
                required: [role]
                properties:
                  role:
                    type: string
                    enum: [main, featured, remixer]
        album:
          allOf:
            - $ref: "#/components/schemas/AlbumRef"
            - type: object
              properties:
                artistName: {type: string}
                year: {type: [integer, "null"]}
        genres:
          type: array
          description: |
            Genres **effectifs** : ceux de la piste s'il y en a (compilation, correction),
            sinon ceux de l'album.
          items:
            allOf:
              - $ref: "#/components/schemas/GenreRef"
              - type: object
                required: [inherited]
                properties:
                  inherited:
                    type: boolean
                    description: "`true` = repris de l'album"
        discNumber: {type: integer}
        trackNumber: {type: [integer, "null"]}
        durationMs: {type: integer}
        coverUrl: {$ref: "#/components/schemas/CoverUrl"}
        streamUrl:
          type: string
          examples: [/api/v2/tracks/1234/stream]
        formats:
          type: array
          description: Fichiers disponibles, le meilleur en premier (c'est lui que sert `original`)
          items: {$ref: "#/components/schemas/AudioFormat"}
        playback: {$ref: "#/components/schemas/PlaybackInfo"}
        favorite: {type: boolean}
        available:
          type: boolean
          description: "`false` si le fichier a disparu du stockage (piste gardée pour l'historique)"

    TrackPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Track"}

    TrackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Track"}

    SearchResults:
      type: object
      required: [artists, albums, tracks]
      properties:
        artists:
          type: array
          items: {$ref: "#/components/schemas/ArtistSummary"}
        albums:
          type: array
          items: {$ref: "#/components/schemas/AlbumSummary"}
        tracks:
          type: array
          items: {$ref: "#/components/schemas/Track"}

    # ---------------------------------------------------------------- Lecture

    QueueMode:
      type: string
      enum: [normal, repeat_all, repeat_one, continuous]

    PlayQueueInput:
      type: object
      required: [trackIds, currentIndex, positionMs, mode]
      properties:
        trackIds:
          type: array
          maxItems: 5000
          items: {type: integer}
        currentIndex:
          type: [integer, "null"]
          description: Position dans `trackIds` de la piste en cours ; null = rien en cours
        positionMs: {type: integer, minimum: 0}
        mode: {$ref: "#/components/schemas/QueueMode"}

    PlayQueue:
      allOf:
        - $ref: "#/components/schemas/PlayQueueInput"
        - type: object
          required: [version, updatedAt, tracks]
          properties:
            version: {type: integer}
            updatedAt: {$ref: "#/components/schemas/DateTime"}
            updatedBy:
              type: [string, "null"]
              description: Nom de l'appareil qui l'a enregistrée en dernier
            tracks:
              type: array
              description: Pistes de `trackIds`, dans le même ordre
              items: {$ref: "#/components/schemas/Track"}

    # ---------------------------------------------------------------- Télécommande (FUT-02)

    QueueShareRights:
      type: object
      description: Ce que peut faire l'invité, en plus de voir la file et la piste en cours
      required: [add, edit, control]
      properties:
        add: {type: boolean, description: Chercher et ajouter des pistes ou des albums}
        edit: {type: boolean, description: Déplacer et retirer des pistes de la file}
        control: {type: boolean, description: "Lecture, pause, piste suivante"}

    QueueShareInput:
      type: object
      required: [hours, rights]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Pour qui (« Soirée chez Paul ») ; par défaut « Invité »
        hours: {type: integer, minimum: 1, maximum: 168, description: Durée de validité}
        rights: {$ref: "#/components/schemas/QueueShareRights"}

    QueueShare:
      type: object
      required: [id, label, prefix, rights, createdAt, expiresAt, lastUsedAt]
      properties:
        id: {type: integer}
        label: {type: string}
        prefix: {type: string, description: "Début du secret, pour reconnaître le lien"}
        rights: {$ref: "#/components/schemas/QueueShareRights"}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        expiresAt: {$ref: "#/components/schemas/DateTime"}
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"

    QueueShareCreated:
      allOf:
        - $ref: "#/components/schemas/QueueShare"
        - type: object
          required: [token, url]
          properties:
            token: {type: string, description: Secret du lien (montré une seule fois)}
            url: {type: string, description: "Adresse à donner : `<site>/telecommande#<token>`"}

    RealtimeChannel:
      type: object
      description: |
        Abonnement au hub Mercure : `GET <hubUrl>?match=<topic>` (un `match` par sujet), en-tête
        `Authorization: Bearer <token>`, réponse en flux SSE. Le hub ferme le flux à l'expiration du jeton.
        Chaque message (`data` de l'événement) est un objet JSON dont `type` vaut :
          - `command` (lecteur) : `{type, target, by, command, tracks}`, une commande d'invité
            (`RemoteCommand`), à appliquer seulement si `target` est la `deviceKey` de ce lecteur ;
            pour `add`, `tracks` donne les pistes complètes (`Track`), dans l'ordre ;
          - `shares` (lecteur) : un lien a été créé ou révoqué, relire `GET /me/realtime` ;
          - `changed` (invité) : la file ou le lecteur ont changé, relire `GET /remote` ;
          - `revoked` (invité) : le lien n'est plus valable ;
          - `disabled` (invité et lecteur) : l'admin a désactivé la télécommande, ne plus s'abonner.
      required: [hubUrl, topics, token, expiresAt]
      properties:
        hubUrl: {type: string, examples: ["https://musique.example.org/.well-known/mercure"]}
        topics:
          type: array
          items: {type: string}
        token: {type: string}
        expiresAt: {$ref: "#/components/schemas/DateTime"}
        sharesActive:
          type: boolean
          description: "(lecteur) Au moins un lien valable : envoyer `PUT /me/player`"

    PlayerReport:
      type: object
      required: [deviceKey, trackId, playing, positionMs, queueVersion]
      properties:
        deviceKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,64}$"
          description: Identifiant tiré au hasard par chaque lecteur (onglet)
        trackId: {type: [integer, "null"]}
        playing: {type: boolean}
        positionMs: {type: integer, minimum: 0}
        queueVersion: {type: integer, minimum: 0, description: Version de la file enregistrée que le lecteur connaît}
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Volume du lecteur en pourcentage (0 si coupé) ; absent pour un lecteur qui ne le donne pas

    RemoteCommand:
      type: object
      description: |
        - `add` : `trackIds` ou `albumId` (toutes ses pistes), `where` = `next` (après la piste en
          cours), `end`, ou `now` (après la piste en cours, et la lecture y passe aussitôt) ; droit `add`,
          plus `control` pour `now`.
        - `move` : l'élément `from` (dont la piste est `trackId`) va en `to` ; droit `edit`.
        - `remove` : l'élément `index` (dont la piste est `trackId`) ; droit `edit`.
        - `play`, `pause`, `next` : droit `control`.
        - `jump` : jouer tout de suite l'élément `index` (dont la piste est `trackId`), sans changer
          l'ordre de la file ; droit `control`.
        - `volume` : régler le volume du lecteur à `volume` % (0 à 100 ; remet le son s'il était
          coupé) ; droit `control`.
        Les positions sont celles de la file reçue par `GET /remote` ; le lecteur ignore une
        commande dont la piste ne correspond plus (file changée entre-temps).
      required: [type]
      properties:
        type: {type: string, enum: [add, move, remove, play, pause, next, jump, volume]}
        trackIds:
          type: array
          maxItems: 200
          items: {type: integer, minimum: 1}
        albumId: {type: integer, minimum: 1}
        where: {type: string, enum: [next, end, now], description: "Par défaut `end`"}
        from: {type: integer, minimum: 0}
        to: {type: integer, minimum: 0}
        index: {type: integer, minimum: 0}
        trackId: {type: integer, minimum: 1}
        volume: {type: integer, minimum: 0, maximum: 100, description: "Pour `volume` : nouveau volume en pourcentage"}
        name:
          type: string
          maxLength: 40
          description: |
            Prénom donné par l'invité (un même lien peut servir à plusieurs personnes). Le lecteur
            l'affiche à la place du nom du lien (`by` du message `command`) ; vide ou absent : nom du lien.

    RemoteState:
      type: object
      required: [share, player, queue, csrfToken, channel]
      properties:
        share:
          type: object
          required: [label, ownerName, rights, expiresAt]
          properties:
            label: {type: string}
            ownerName: {type: string, description: Nom affiché du compte dont on pilote la file}
            rights: {$ref: "#/components/schemas/QueueShareRights"}
            expiresAt: {$ref: "#/components/schemas/DateTime"}
        player:
          type: object
          required: [online, playing, trackId, positionMs, reportedAt, volume]
          properties:
            online: {type: boolean, description: Un lecteur de ce compte a donné des nouvelles depuis moins de 75 s}
            playing: {type: boolean}
            trackId: {type: [integer, "null"]}
            positionMs: {type: integer, description: Position au moment du rapport}
            volume:
              type: [integer, "null"]
              minimum: 0
              maximum: 100
              description: Volume du lecteur en pourcentage (0 si coupé) ; null si le lecteur ne l'a pas donné
            reportedAt:
              oneOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
        queue:
          type: object
          required: [version, currentIndex, tracks]
          properties:
            version: {type: integer}
            currentIndex: {type: [integer, "null"]}
            tracks:
              type: array
              description: Pistes de la file, dans l'ordre (doublons compris)
              items: {$ref: "#/components/schemas/Track"}
        csrfToken: {type: string, description: "À renvoyer dans `X-CSRF-Token` pour `POST /remote/commands`"}
        channel: {$ref: "#/components/schemas/RealtimeChannel"}

    FavoriteType:
      type: string
      enum: [track, album, artist]

    FavoritePage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [type, addedAt]
                properties:
                  type: {$ref: "#/components/schemas/FavoriteType"}
                  addedAt: {$ref: "#/components/schemas/DateTime"}
                  track: {$ref: "#/components/schemas/Track"}
                  album: {$ref: "#/components/schemas/AlbumSummary"}
                  artist: {$ref: "#/components/schemas/ArtistSummary"}

    PlayContext:
      type: string
      enum: [album, artist, search, random, continuous, queue, other]

    PlayInput:
      type: object
      required: [trackId, startedAt, playedMs]
      properties:
        trackId: {type: integer}
        startedAt: {$ref: "#/components/schemas/DateTime"}
        playedMs: {type: integer, minimum: 0}
        completed: {type: boolean, default: false}
        skipped: {type: boolean, default: false}
        context: {$ref: "#/components/schemas/PlayContext"}

    PlayHistoryPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, startedAt, playedMs, completed, skipped, context, track]
                properties:
                  id:
                    type: integer
                    description: Identifiant de l'écoute (pour l'effacer, depuis 2.26.0)
                  startedAt: {$ref: "#/components/schemas/DateTime"}
                  playedMs: {type: integer}
                  completed: {type: boolean}
                  skipped: {type: boolean}
                  context: {$ref: "#/components/schemas/PlayContext"}
                  device: {type: [string, "null"]}
                  track: {$ref: "#/components/schemas/Track"}

    NextTracksRequest:
      type: object
      required: [count]
      properties:
        currentTrackId:
          type: [integer, "null"]
          description: Dernière piste jouée ; sert de référence pour la clé, le BPM, l'énergie
        recentTrackIds:
          type: array
          maxItems: 200
          items: {type: integer}
          description: Pistes déjà dans la file, à ne pas proposer
        count: {type: integer, minimum: 1, maximum: 50, default: 10}
        overrides:
          type: object
          description: Remplace certaines règles `continuous` des réglages pour cette demande
          additionalProperties: true
          properties:
            genres:
              type: array
              items: {type: integer}
            harmonicMixing: {type: boolean}
            bpmTolerancePercent: {type: [integer, "null"]}
            energyTrend:
              type: string
              enum: [any, steady, rising, falling]
            mood: {$ref: "#/components/schemas/MoodId"}
            yearFrom: {type: integer}
            yearTo: {type: integer}
            collection: {type: integer}

    # ---------------------------------------------------------------- Admin bibliothèque

    ChangeEntityType:
      type: string
      enum: [album, track, artist, genreAlias]

    AlbumPatch:
      type: object
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        year: {type: [integer, "null"], minimum: 1000, maximum: 2100}
        albumArtist:
          type: [string, "null"]
          description: Nom de l'artiste (créé s'il n'existe pas) ; null = artistes divers
        isCompilation: {type: boolean}
        genreIds:
          type: array
          description: Remplace la liste des genres de l'album
          items: {type: integer}
        collectionIds:
          type: array
          items: {type: integer}
        coverImageHash:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: Choisir une autre image déjà connue comme jaquette

    TrackPatch:
      type: object
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        artistCredit: {type: [string, "null"], maxLength: 500}
        discNumber: {type: integer, minimum: 1, maximum: 99}
        trackNumber: {type: [integer, "null"], minimum: 0, maximum: 999}
        bpm: {type: [number, "null"], minimum: 20, maximum: 300}
        key:
          type: [string, "null"]
          pattern: "^[A-G][#b]?m?$"
        genreIds:
          type: [array, "null"]
          items: {type: integer}
          description: Genres propres à la piste ; `null` = reprendre ceux de l'album
        albumId:
          type: integer
          description: Déplacer la piste dans un autre album (séparer ou regrouper des albums)

    ArtistPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        sortName: {type: [string, "null"], maxLength: 255}

    AdminAlbumDetail:
      allOf:
        - $ref: "#/components/schemas/AlbumDetail"
        - type: object
          required: [sourceDir, files, activeCorrections]
          properties:
            sourceDir: {type: string, description: Dossier dans le stockage}
            files:
              type: array
              items:
                type: object
                required: [trackId, storageKey, format, sizeBytes]
                properties:
                  trackId: {type: integer}
                  storageKey: {type: string}
                  format: {type: string}
                  sizeBytes: {type: integer}
                  tags:
                    type: object
                    description: Tags bruts lus par ffprobe
                    additionalProperties: true
            activeCorrections:
              type: array
              items: {$ref: "#/components/schemas/Correction"}

    CorrectionStatus:
      type: string
      enum: [proposed, active, rejected, reverted]

    Correction:
      type: object
      required: [id, entityType, entityId, field, value, previousValue, status, createdBy, createdAt]
      properties:
        id: {type: integer}
        entityType: {$ref: "#/components/schemas/ChangeEntityType"}
        entityId:
          type: [integer, "null"]
          description: "`null` pour `genreAlias` (voir `alias`)"
        alias:
          type: string
          description: "Valeur de tag, pour `entityType: genreAlias`"
        field: {type: string, examples: [year]}
        value: {description: Nouvelle valeur (type selon le champ)}
        previousValue: {description: Valeur avant la correction}
        status: {$ref: "#/components/schemas/CorrectionStatus"}
        changeSetId: {type: [integer, "null"]}
        reason:
          type: [string, "null"]
          description: Explication de l'auteur (proposition de l'agent)
        createdBy: {$ref: "#/components/schemas/UserRef"}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        revertedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"

    CorrectionPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Correction"}

    ChangeInput:
      type: object
      required: [entityType, field, value]
      properties:
        entityType: {$ref: "#/components/schemas/ChangeEntityType"}
        entityId:
          type: integer
          description: Obligatoire sauf pour `genreAlias`
        alias:
          type: string
          description: "Seulement pour `entityType: genreAlias`"
        field:
          type: string
          description: |
            Mêmes champs que `AlbumPatch` (sauf `collectionIds`), `TrackPatch` et `ArtistPatch`
            (ex. `genreIds`, `year`, `albumArtist`, `title`, `albumId`). En plus, pour un artiste,
            `mergedInto` (identifiant d'un autre artiste) le fusionne dans celui-ci. Pour rattacher
            une valeur de tag à un genre : `entityType: genreAlias`, `field: genreId`, `alias` à la
            place de `entityId`.
        value: {description: Nouvelle valeur}
        reason:
          type: string
          maxLength: 1000
          description: Explication de l'agent, affichée à l'admin

    ChangeSetStatus:
      type: string
      enum: [draft, pending, applied, rejected, reverted]

    ChangeSetInput:
      type: object
      required: [title, changes]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 10000}
        changes:
          type: array
          minItems: 1
          maxItems: 2000
          items: {$ref: "#/components/schemas/ChangeInput"}

    ChangeSet:
      type: object
      required: [id, title, status, createdBy, createdAt, changeCount]
      properties:
        id: {type: integer}
        title: {type: string}
        description: {type: [string, "null"]}
        status: {$ref: "#/components/schemas/ChangeSetStatus"}
        createdBy: {$ref: "#/components/schemas/UserRef"}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        decidedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        decidedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        changeCount: {type: integer}
        changes:
          type: array
          description: Présent dans le détail d'un lot
          items:
            allOf:
              - $ref: "#/components/schemas/ChangeInput"
              - type: object
                required: [currentValue, correctionId, status, previousValue]
                properties:
                  label:
                    type: string
                    description: "Nom lisible de l'élément (« Titre — Artiste » pour un album ou une piste, nom d'un artiste), depuis 2.27.0"
                  currentValue: {description: "Valeur actuelle, pour comparer"}
                  previousValue: {description: "Valeur au moment de la proposition (ou de l'application)"}
                  correctionId: {type: integer}
                  status: {$ref: "#/components/schemas/CorrectionStatus"}

    McpRequest:
      type: object
      description: Message JSON-RPC 2.0 (un seul par requête)
      required: [jsonrpc, method]
      properties:
        jsonrpc: {const: "2.0"}
        id:
          type: [integer, string]
          description: Absent pour une notification
        method:
          type: string
          examples: [tools/call]
        params:
          type: object
          additionalProperties: true

    McpResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc: {const: "2.0"}
        id: {type: [integer, string, "null"]}
        result:
          type: object
          additionalProperties: true
          description: |
            Selon la méthode. `tools/call` : `content` (un bloc `text` contenant la réponse JSON de la
            route), et `isError: true` si l'outil a échoué.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: "`-32600` message invalide, `-32601` méthode inconnue, `-32602` outil ou paramètres inconnus"
            message: {type: string}

    ChangeSetPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/ChangeSet"}

    # ---------------------------------------------------------------- Tâches et journaux

    JobType:
      type: string
      enum: [index, analyze, inbox, thumbnails, import, mail, dedup, purge, organize]

    JobStatus:
      type: string
      enum: [queued, running, done, failed, cancelled]

    JobInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [index, analyze, import, inbox, dedup, organize]
          description: |
            Seules ces tâches se lancent à la main. `inbox` range les albums déposés dans `inbox/`
            (ceux qui n'ont pas bougé depuis 10 min) puis indexe ceux qui ont été rangés.
            `dedup` retire les MP3 en double d'un album (`params.albumId`, voir `/admin/duplicates`) :
            ils sont déplacés dans la corbeille du stockage, pas supprimés.
            `organize` (IA-04) confie la consigne `params.instructions` au modèle configuré sur le
            serveur (`assistant` dans les réglages du serveur) : il travaille avec les outils du serveur
            MCP, sous le nom du premier compte agent actif, et ne peut que **proposer** des lots
            (`/admin/change-sets`, statut `pending`). Le compte rendu arrive dans `summary`. `409` si
            aucune IA n'est configurée ou s'il n'y a pas de compte agent.
        params:
          type: object
          additionalProperties: true
          properties:
            prefix:
              type: string
              description: Ne traiter qu'un dossier du stockage
            force:
              type: boolean
              description: Relire même les fichiers inchangés
            albumId:
              type: integer
              description: "`dedup` (obligatoire) : l'album dont on retire les MP3 en double"
            instructions:
              type: string
              minLength: 1
              maxLength: 4000
              description: "`organize` (obligatoire) : ce que l'admin demande au modèle"

    Job:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id: {type: integer}
        type: {$ref: "#/components/schemas/JobType"}
        status: {$ref: "#/components/schemas/JobStatus"}
        params:
          type: [object, "null"]
          additionalProperties: true
        stats:
          type: [object, "null"]
          description: Compteurs (vus, ajoutés, modifiés, disparus, erreurs…)
          additionalProperties: {type: integer}
        requestedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        summary:
          type: [string, "null"]
          description: "Compte rendu en texte (`organize` : réponse du modèle et lots proposés)"
        createdAt: {$ref: "#/components/schemas/DateTime"}
        startedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        finishedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"

    LogLevel:
      type: string
      enum: [debug, info, warning, error, critical]

    LogEntry:
      type: object
      required: [ts, level, source, requestId, userId, message, context]
      properties:
        ts: {$ref: "#/components/schemas/DateTime"}
        level: {$ref: "#/components/schemas/LogLevel"}
        source: {type: string, enum: [api, cli, securite]}
        requestId: {type: [string, "null"]}
        userId: {type: [integer, "null"]}
        message:
          type: string
          description: Message, ou nom de l'événement pour le journal de sécurité (`login_failed`…)
        context:
          type: [object, "null"]
          additionalProperties: true
          description: Détails (pour la sécurité, `ip` et les autres champs de la ligne)

    LogPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/LogEntry"}
        next:
          type: [string, "null"]
          description: À passer dans `cursor` pour la suite ; null = début des journaux atteint

    BackgroundRef:
      type: object
      required: [id, imageUrl]
      properties:
        id: {type: integer}
        imageUrl: {type: string, description: "Adresse de l'image (sous /api/v2), avec son empreinte"}

    Background:
      type: object
      required: [id, name, active, width, height, sizeBytes, mimeType, imageUrl, createdAt]
      properties:
        id: {type: integer}
        name: {type: string}
        active: {type: boolean, description: "Fait partie du tirage au hasard"}
        width: {type: integer}
        height: {type: integer}
        sizeBytes: {type: integer}
        mimeType: {type: string, enum: [image/jpeg, image/png, image/webp]}
        imageUrl: {type: string}
        createdAt: {$ref: "#/components/schemas/DateTime"}

    InboxItem:
      type: object
      required: [id, sourceDir, status, fileCount, sizeBytes, message, albumTitle, albumArtist, targetDir, firstSeenAt, updatedAt, filedAt]
      properties:
        id: {type: integer}
        sourceDir: {type: string, description: "Dossier déposé, ex. inbox/Téléchargés/Tonight"}
        status:
          type: string
          enum: [waiting, incomplete, blocked, filed]
          description: |
            `waiting` : copie en cours ou modifié récemment ; `incomplete` : pistes manquantes d'après les
            tags (rangé quand même après 24 h) ; `blocked` : à ranger à la main, voir `message` ;
            `filed` : rangé dans `targetDir`.
        fileCount: {type: integer}
        sizeBytes: {type: integer}
        message: {type: [string, "null"], description: "Raison d'un blocage ou avertissement"}
        albumTitle: {type: [string, "null"]}
        albumArtist: {type: [string, "null"], description: "null pour une compilation"}
        targetDir: {type: [string, "null"], description: "Dossier de rangement, prévu ou fait"}
        firstSeenAt: {$ref: "#/components/schemas/DateTime"}
        updatedAt: {$ref: "#/components/schemas/DateTime"}
        filedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"

    DuplicateAlbum:
      type: object
      required: [albumId, title, artist, removable, kept, removableBytes]
      properties:
        albumId: {type: integer}
        title: {type: string}
        artist: {type: [string, "null"], description: "null pour une compilation"}
        removable: {type: integer, description: MP3 retirables (leur FLAC est là et de même durée)}
        kept: {type: integer, description: MP3 gardés malgré un FLAC (voir le détail)}
        removableBytes: {type: integer}

    DamagedTrack:
      type: object
      required: [track, storageKey, errors, detail]
      properties:
        track: {$ref: "#/components/schemas/Track"}
        storageKey: {type: string, description: Fichier vérifié (celui qui est servi)}
        errors: {type: integer, minimum: 1, description: Trames illisibles}
        detail:
          type: [string, "null"]
          description: "Où on les entend et la raison du décodeur (« à 0:35 et 2:08 : flac : invalid subframe padding »)"

    SameRecordingGroup:
      type: object
      required: [score, verdict, tracks]
      properties:
        score: {type: number, minimum: 0, maximum: 1, description: Ressemblance la plus faible entre deux pistes du groupe}
        verdict:
          type: string
          enum: [same, close]
          description: "`same` : même enregistrement (score ≥ 0,95) ; `close` : très proche"
        tracks:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/Track"}

    DuplicateAlbumDetail:
      allOf:
        - $ref: "#/components/schemas/DuplicateAlbum"
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items: {$ref: "#/components/schemas/DuplicateFile"}

    DuplicateFile:
      type: object
      required: [trackId, discNumber, trackNumber, title, mp3, lossless, removable, reason]
      properties:
        trackId: {type: integer}
        discNumber: {type: [integer, "null"]}
        trackNumber: {type: [integer, "null"]}
        title: {type: string}
        mp3:
          type: object
          required: [storageKey, sizeBytes, durationMs, bitrateKbps]
          properties:
            storageKey: {type: string}
            sizeBytes: {type: integer}
            durationMs: {type: integer}
            bitrateKbps: {type: [integer, "null"]}
        lossless:
          type: object
          required: [storageKey, format, durationMs, available]
          properties:
            storageKey: {type: string}
            format: {type: string, enum: [flac, alac, wav]}
            durationMs: {type: integer}
            available: {type: boolean, description: Présent dans le stockage au dernier passage}
        removable: {type: boolean}
        reason: {type: [string, "null"], description: "Pourquoi le MP3 est gardé, ex. « durées différentes (22 s) »"}

    JobPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Job"}

    JobError:
      type: object
      required: [id, jobId, code, message, createdAt]
      properties:
        id: {type: integer}
        jobId: {type: integer}
        storageKey: {type: [string, "null"]}
        code: {type: string, examples: [probe_failed]}
        message: {type: string}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        resolvedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"

    JobErrorPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/JobError"}

    AuditEntry:
      type: object
      required: [id, createdAt, action]
      properties:
        id: {type: integer}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        action: {type: string, examples: [user.approve]}
        targetType: {type: [string, "null"]}
        targetId: {type: [integer, "null"]}
        before: {description: État avant (jamais de secret)}
        after: {description: État après}
        ip: {type: [string, "null"]}
        requestId: {type: [string, "null"]}

    AuditPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/AuditEntry"}
