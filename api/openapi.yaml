  /admin/change-sets/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: action
        in: path
        required: true
        description: |
          `apply` applique le lot (`pending` → `applied`), `reject` le refuse
          (`pending` → `rejected`), `revert` annule un lot appliqué (`applied` → `reverted`,
          toutes ses corrections encore actives). À l'application, chaque changement est vérifié
          de nouveau : si l'un n'est plus possible (genre supprimé, artiste déjà fusionné…), rien
          n'est appliqué et la réponse est `409`.
        schema:
          type: string
          enum: [apply, reject, revert]
