  # ===========================================================================
  # Lecture : flux, images, lecture continue
  # ===========================================================================

  /tracks/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lecture]
      operationId: streamTrack
      summary: Flux audio de la piste, avec les requêtes Range
      description: |
        `format=original` (par défaut) sert le **meilleur** fichier tel quel : sans perte s'il
        existe, sinon le plus haut débit. Les requêtes `Range` (une seule plage) répondent `206`,
        ce qu'il faut pour avancer dans le morceau.

        Les autres formats sont des **conversions à la volée** (LEC-04), annoncées par
        `ServerInfo.features.transcoding` et `transcodingFormats` ; sinon `501 not_implemented`.
        - Le serveur ne convertit que si c'est utile : un MP3 n'est jamais converti en MP3, un
          fichier avec perte jamais en FLAC, ni vers un débit égal ou supérieur au sien. Il sert
          alors le fichier d'origine (le `Content-Type` dit ce qui arrive).
        - Une conversion déjà faite est gardée en cache : elle se sert comme un fichier, avec
          `Content-Length`, `ETag` et `Range`.
        - Sinon le flux part pendant la conversion : pas de `Content-Length`,
          `Accept-Ranges: none`, et une `Range` qui ne commence pas à 0 répond `416`. Pour
          avancer, on redemande la piste avec `startMs` (la réponse commence à cette position).
        - `startMs` ne s'applique qu'à une conversion ; il est ignoré pour le fichier d'origine.

        Le lecteur web s'authentifie par son cookie : l'élément `<audio>` ne peut pas envoyer
        d'en-tête `Authorization`.
      x-priority: P1
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [original, mp3, opus, flac]
            default: original
        - name: bitrate
          in: query
          description: "Débit en kbit/s, pour une conversion. Par défaut : Opus 160, MP3 192."
          schema: {type: integer, enum: [96, 128, 160, 192, 256, 320]}
        - name: startMs
          in: query
          description: Position de départ, pour une conversion
          schema: {type: integer, minimum: 0}
        - name: Range
          in: header
          schema: {type: string, examples: ["bytes=0-1048575"]}
      responses:
        "200":
          description: Fichier complet
          headers:
            Accept-Ranges:
              description: "`none` pour une conversion en cours (pas encore en cache)"
              schema: {type: string, enum: [bytes, none]}
            Content-Length:
              description: Absent pour une conversion en cours
              schema: {type: integer}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            audio/mpeg: {schema: {type: string, contentMediaType: audio/mpeg}}
            audio/flac: {schema: {type: string, contentMediaType: audio/flac}}
            audio/ogg: {schema: {type: string, contentMediaType: audio/ogg}}
            audio/mp4: {schema: {type: string, contentMediaType: audio/mp4}}
        "206":
          description: Plage demandée
          headers:
            Content-Range: {schema: {type: string, examples: ["bytes 0-1048575/31457280"]}}
            Content-Length: {schema: {type: integer}}
          content:
            audio/mpeg: {schema: {type: string, contentMediaType: audio/mpeg}}
            audio/flac: {schema: {type: string, contentMediaType: audio/flac}}
            audio/ogg: {schema: {type: string, contentMediaType: audio/ogg}}
            audio/mp4: {schema: {type: string, contentMediaType: audio/mp4}}
        "304": {description: Inchangé (If-None-Match)}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416":
          description: Plage hors du fichier, plusieurs plages, ou plage au milieu d’une conversion en cours
          headers:
            Content-Range: {schema: {type: string, examples: ["bytes */31457280"]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "501": {$ref: "#/components/responses/NotImplemented"}
        "503": {$ref: "#/components/responses/StorageUnavailable"}

