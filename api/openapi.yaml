        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  # ===========================================================================
  # Serveur MCP (IA-03)
  # ===========================================================================

  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: Serveur MCP (Model Context Protocol) pour l'agent Claude
      description: |
        Transport MCP « Streamable HTTP », sans session : chaque `POST` porte un message JSON-RPC 2.0
        et reçoit sa réponse en `application/json` (jamais de flux `text/event-stream` ; `GET` répond
        `405`). Versions du protocole acceptées : `2025-11-25`, `2025-06-18`, `2025-03-26`.

        Méthodes : `initialize`, `ping`, `tools/list`, `tools/call`. Une notification (message sans
        `id`, comme `notifications/initialized`) reçoit `202` sans corps.

        Les outils sont des routes de cette API, appelées en interne avec les droits du jeton : lire
        la bibliothèque (recherche, albums avec leurs tags bruts, artistes, pistes, genres, valeurs de
        genre des tags, collections, doublons, mêmes enregistrements, fichiers abîmés, dépôt, erreurs
        d'indexation, corrections, lots) et proposer un lot de changements (`propose_changes`, comme
        `POST /admin/change-sets`). Rien d'autre ne modifie la bibliothèque.

        Une erreur de l'outil (identifiant inconnu, valeur refusée) revient dans le résultat avec
        `isError: true` et le message dans la langue du serveur ; une erreur de protocole dans `error`.
        Jeton obligatoire (`Authorization: Bearer`, jeton d'un compte agent ou admin) : une session
        web reçoit `403`.

        Avec Claude Code : `claude mcp add --transport http rengaine https://<serveur>/api/v2/mcp
        --header "Authorization: Bearer <jeton>"`.
      x-priority: P2
      x-roles: [admin, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/McpRequest"}
      responses:
        "200":
          description: Réponse JSON-RPC (`result` ou `error`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/McpResponse"}
        "202":
          description: Notification reçue
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

