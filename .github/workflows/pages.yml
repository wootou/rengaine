# Site public (website/) et doc du contrat (api/doc.sh), publiés sur GitHub Pages à chaque push sur main.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Doc du contrat
        run: sh api/doc.sh
      - name: Site
        working-directory: website
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
